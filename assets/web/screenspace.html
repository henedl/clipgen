<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Screenspace</title>
  <!-- CLIPGEN_HEAD_HERE -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="topnav.css">
  <link rel="stylesheet" href="screenspace.css">
  <link rel="stylesheet" href="settings-modal.css">
  <link rel="stylesheet" href="color-picker.css">
  <link rel="stylesheet" href="start-overlay.css">
</head>
<body data-frontend="screenspace">
  <!-- Shared chrome: TopNav + start overlay -->
  <topnav-mount data-frontend="screenspace"></topnav-mount>
  <start-overlay-mount></start-overlay-mount>

  <div id="ssSubheader">
    <div class="subheader-left">
      <label class="participant-label">
        Source
        <select id="participantSelect"><option value="">No participants</option></select>
      </label>
      <span id="videoInfo" class="video-info"></span>
    </div>
  </div>

  <main id="ssMain">
  <!-- Main: info panel + frame viewer + timeline -->

    <div class="ss-content-row">
      <aside id="ssInfoPanel">
        <div class="ss-info-content">
          <div class="ss-info-header-row">
            <div class="ss-info-block ss-info-block--participant">
              <div class="ss-info-label">Participant</div>
              <div id="ssInfoParticipant" class="ss-info-value ss-info-value--lg">&mdash;</div>
            </div>
            <button id="ssInfoCollapseBtn" class="ss-info-collapse-btn" type="button" title="Hide panel" aria-label="Hide panel">
              <span class="ss-info-collapse-icon"></span>
            </button>
          </div>
          <div class="ss-info-block">
            <div class="ss-info-label">Notes</div>
            <textarea id="ssInfoNotes" class="ss-info-notes" rows="4" spellcheck="false" autocomplete="off" placeholder="Notes for this participant&hellip;"></textarea>
          </div>
          <section id="ssInfoIssuesBlock" class="ss-info-section hidden" data-section="issues">
            <button class="ss-info-section-header" type="button" aria-expanded="true">
              <span class="ss-info-section-chevron"></span>
              <span>Top issues</span>
            </button>
            <div class="ss-info-section-body">
              <ul id="ssInfoIssues" class="ss-info-issues"></ul>
            </div>
          </section>
          <section id="ssInfoMarksBlock" class="ss-info-section hidden" data-section="marks">
            <button class="ss-info-section-header" type="button" aria-expanded="true">
              <span class="ss-info-section-chevron"></span>
              <span>Transcript tags</span>
            </button>
            <div class="ss-info-section-body">
              <ul id="ssInfoMarks" class="ss-info-issues"></ul>
            </div>
          </section>
        </div>
      </aside>
      <button id="ssInfoExpandBtn" class="ss-info-expand-btn hidden" type="button" title="Show panel" aria-label="Show panel">
        <span class="ss-info-expand-icon"></span>
      </button>
      <div class="ss-content-main">
    <section id="viewerSection">
      <div id="frameContainer">
        <video id="videoPlayer" preload="metadata" playsinline></video>
        <canvas id="frameCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <div id="frameEmpty"><div class="skeleton skeleton-frame"></div></div>
        <div id="previewResizeHandle" class="preview-resize-handle"></div>
      </div>
      <div id="regionBar">
        <div id="regionChipsScroll"><div id="regionChips"></div></div>
        <div id="regionActions">
          <button id="toolRectBtn" class="region-toggle-btn active" title="Rectangle: drag to select"></button>
          <button id="toolLassoBtn" class="region-toggle-btn" title="Lasso: draw a freehand shape"></button>
          <button id="toolWandBtn" class="region-toggle-btn" title="Magic wand: click a similar-colored area"></button>
          <span id="wandToleranceWrap" class="wand-tolerance hidden">
            <input id="wandToleranceInput" type="range" min="4" max="120" step="1" value="32" title="Wand color tolerance">
            <span id="wandToleranceValue">32</span>
          </span>
          <span class="region-actions-sep"></span>
          <button id="saveRegionBtn" class="btn btn-small hidden">Save Region</button>
          <button id="clearSelectionBtn" class="btn btn-small hidden">Clear</button>
          <button id="mergeRegionsBtn" class="btn btn-small hidden" title="Merge the shift-selected regions into the active region">Merge</button>
          <button id="deleteRegionBtn" class="btn btn-small hidden">Delete</button>
          <button id="deleteAllRegionsBtn" class="btn btn-small hidden">Delete all</button>
          <button id="toggleLabelsBtn" class="region-toggle-btn hidden" title="Toggle region names"></button>
          <button id="toggleRegionsBtn" class="region-toggle-btn hidden" title="Toggle region visibility"></button>
          <button id="stashRegionsBtn" class="region-toggle-btn hidden" title="Stash all regions"></button>
          <span class="region-actions-sep"></span>
          <button id="videoPlayBtn" class="region-toggle-btn" title="Play/Pause (Space)"></button>
          <button id="videoMuteBtn" class="region-toggle-btn" title="Toggle mute"></button>
          <button id="videoSpeedBtn" class="region-toggle-btn video-speed-btn" title="Playback speed">1x</button>
          <span class="region-actions-sep"></span>
          <button id="pinPositiveBtn" class="region-toggle-btn region-pin-btn" title="Pin this frame as a positive (condition is true here)"></button>
          <button id="pinNegativeBtn" class="region-toggle-btn region-pin-btn" title="Pin this frame as a negative (condition must not fire here)"></button>
          <button id="togglePinTrayBtn" class="region-toggle-btn hidden" title="Hide pinned frames"></button>
        </div>
      </div>
      <div id="pinTray" class="pin-tray hidden">
        <span class="pin-tray-label">Pins</span>
        <div id="pinTrayItems" class="pin-tray-items"></div>
        <button id="clearPinsBtn" class="btn btn-small pin-tray-clear hidden" type="button">Clear all</button>
      </div>
    </section>

    <section id="timelineSection">
      <div id="timelineRow">
        <div id="timelineCanvasWrapper">
          <div id="boundaryFlagRail"></div>
          <canvas id="timelineCanvas"></canvas>
          <canvas id="playheadCanvas"></canvas>
        </div>
        <div id="timelineSeek">
          <input id="timestampInput" type="text" placeholder="0:00" spellcheck="false" autocomplete="off">
          <div id="timelineStepBtns">
            <button id="framePrev" class="btn btn-small btn-icon" title="Step back 1s"></button>
            <button id="frameNext" class="btn btn-small btn-icon" title="Step forward 1s"></button>
          </div>
        </div>
      </div>
      <div id="timelineControls">
        <button id="zoomInBtn" class="btn btn-small btn-icon"></button>
        <button id="zoomOutBtn" class="btn btn-small btn-icon"></button>
        <button id="zoomResetBtn" class="btn btn-small">Reset</button>
        <button id="amplitudeGraphBtn" class="btn btn-small btn-icon" title="Toggle amplitude graph" aria-label="Toggle amplitude graph"><span class="amplitude-btn-icon"></span></button>
        <span class="timeline-sep"></span>
        <button id="setInBtn" class="btn btn-small">Set In</button>
        <button id="setOutBtn" class="btn btn-small">Set Out</button>
        <button id="clearMarkersBtn" class="btn btn-small hidden">Clear Markers</button>
        <span id="markerInfo" class="marker-info"></span>
        <div id="timelineLegend"></div>
      </div>
    </section>
      </div>
    </div>

  </main>

  <div id="panelDivider">
  <!-- Split: main column vs workflow + task queue -->
<div class="divider-handle"></div></div>

  <div id="bottomPanel">
  <!-- Bottom: workflow, run row, task queue + results -->
    <section id="workflowSection">
      <div id="workflowTabs">
        <button class="wf-tab" data-type="multitool">
          <span class="ss-task-icon ss-task-icon--multitool"></span>
          Multitool
        </button>
        <button class="wf-tab active" data-type="color">
          <span class="ss-task-icon ss-task-icon--color"></span>
          Color
        </button>
        <button class="wf-tab" data-type="change">
          <span class="ss-task-icon ss-task-icon--change"></span>
          Change
        </button>
        <button class="wf-tab" data-type="similarity">
          <span class="ss-task-icon ss-task-icon--similarity"></span>
          Similarity
        </button>
        <button class="wf-tab" data-type="text">
          <span class="ss-task-icon ss-task-icon--text"></span>
          Text
        </button>
        <button class="wf-tab" data-type="numbers">
          <span class="ss-task-icon ss-task-icon--numbers"></span>
          Numbers
        </button>
        <button class="wf-tab" data-type="timelapse">
          <span class="ss-task-icon ss-task-icon--timelapse"></span>
          Timelapse
        </button>
        <button class="wf-tab" data-type="template">
          <span class="ss-task-icon ss-task-icon--template"></span>
          Template
        </button>
        <button class="wf-tab" data-type="flow">
          <span class="ss-task-icon ss-task-icon--flow"></span>
          Flow
        </button>
        <button class="wf-tab" data-type="scene">
          <span class="ss-task-icon ss-task-icon--scene"></span>
          Scene
        </button>
        <button class="wf-tab" data-type="inactivity">
          <span class="ss-task-icon ss-task-icon--inactivity"></span>
          Inactivity
        </button>
        <button class="wf-tab" data-type="boundary">
          <span class="ss-task-icon ss-task-icon--boundary"></span>
          Boundary
        </button>
      </div>
      <div id="workflowActionRow">
        <button id="toolInfoBtn" class="tool-info-btn"><span class="ss-task-icon ss-task-icon--info"></span></button>
        <div id="runParticipantPicker" class="run-picker-wrap"></div>
        <div id="workflowIntervalSlot"></div>
        <div id="runRegionPicker" class="run-picker-wrap"></div>
        <div id="runScanModePicker"></div>
        <button id="runBtn" class="btn btn-primary btn-icon" disabled data-tooltip="Select a region first">
          <span class="ss-task-icon ss-task-icon--play"></span>
          Run
        </button>
      </div>
      <div id="workflowBody">
        <div id="workflowParams"></div>
        <div id="modelViewPanel" class="model-view-panel collapsed">
          <button id="modelViewToggle" class="model-view-toggle" type="button" aria-expanded="false">
            <span class="model-view-icon"></span>
            <span class="model-view-label">Model view</span>
            <span class="model-view-hint">what the CV model sees</span>
          </button>
          <div id="modelViewBody" class="model-view-body hidden">
            <div id="modelViewMeta" class="model-view-meta">Select a region to preview.</div>
            <div id="modelViewOverlayRow" class="model-view-overlay-row">
              <label class="model-view-overlay-toggle">
                <input id="modelViewOverlayToggle" type="checkbox" />
                <span>Overlay on frame</span>
              </label>
              <select id="modelViewOverlayLayer" class="model-view-overlay-layer hidden" aria-label="Overlay layer"></select>
              <span class="model-view-overlay-hint">hold <kbd>B</kbd> to blink</span>
            </div>
            <img id="modelViewImage" alt="Preprocessed preview" />
          </div>
        </div>
        <div id="calibrationPanel" class="cal-panel collapsed hidden">
          <button id="calibrationToggle" class="cal-toggle" type="button" aria-expanded="false">
            <span class="cal-icon"></span>
            <span class="cal-label">Calibration</span>
            <span class="cal-hint">score against pinned frames</span>
          </button>
          <div id="calibrationBody" class="cal-body hidden">
            <div id="calibrationSummary" class="cal-summary" aria-live="polite"></div>
            <div id="calibrationStrips" class="cal-strips"></div>
            <div id="calibrationNote" class="cal-note hidden"></div>
            <div id="calibrationStatus" class="cal-status hidden"></div>
          </div>
        </div>
      </div>
    </section>
    <div id="rightPane">
      <div id="rightPaneTabs">
        <button class="rp-tab active" data-tab="queue" type="button">
          <span class="rp-tab-icon rp-tab-icon-queue"></span>
          <span class="rp-tab-label">Task Queue</span>
          <span class="rp-tab-count" id="taskCount">(0)</span>
        </button>
        <span class="rp-tab-sep">/</span>
        <button class="rp-tab" data-tab="results" type="button">
          <span class="rp-tab-icon rp-tab-icon-results"></span>
          <span class="rp-tab-label">Results</span>
          <span class="rp-tab-crumb" id="resultsTabCrumb"></span>
          <span class="rp-tab-chevron"></span>
        </button>
        <div class="rp-tab-actions" data-for="queue">
          <button id="taskFilterDoneBtn" class="panel-header-btn task-filter-btn" title="Show completed" data-filter="completed"></button>
          <button id="taskFilterFailedBtn" class="panel-header-btn task-filter-btn" title="Show failed" data-filter="failed"></button>
          <button id="taskQueuePauseBtn" class="panel-header-btn" title="Pause queue"></button>
        </div>
        <div class="rp-tab-actions hidden" data-for="results" id="resultsActions">
          <div id="certaintyCutoffWrap" class="rp-certainty-wrap hidden">
            <input type="range" id="certaintyCutoff" min="0" max="100" value="0" step="1" class="rp-certainty-slider">
          </div>
          <button id="showExcludedBtn" class="rp-icon-btn active" type="button" aria-label="Show excluded">
            <span class="rp-icon-btn-icon rp-icon-eye"></span>
          </button>
          <button id="excludeNonVisibleBtn" class="rp-icon-btn hidden" type="button" aria-label="Exclude hidden">
            <span class="rp-icon-btn-icon rp-icon-scissors"></span>
          </button>
          <div id="exportEventsWrap" class="rp-export-wrap">
            <button id="exportEventsBtn" class="rp-icon-btn" type="button" aria-label="Export events" aria-haspopup="menu" aria-expanded="false">
              <span class="rp-icon-btn-icon rp-icon-download"></span>
            </button>
            <div id="exportEventsMenu" class="rp-export-menu hidden" role="menu">
              <button class="rp-export-item" type="button" role="menuitem" data-format="csv">CSV</button>
              <button class="rp-export-item" type="button" role="menuitem" data-format="json">JSON</button>
            </div>
          </div>
        </div>
        <div id="resultsSwitcherPanel" class="rp-switcher-panel hidden"></div>
      </div>
      <div id="rightPaneBody">
        <div id="taskQueuePanel" class="rp-tab-panel">
          <div id="taskList">
            <div class="panel-empty">No tasks yet. Configure a workflow and click Run.</div>
          </div>
        </div>
        <div id="resultsPanel" class="rp-tab-panel hidden">
          <div id="confHistogram" class="conf-hist hidden"></div>
          <div id="resultsList">
            <div class="panel-empty">Click a completed task to view results.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="regionNameModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Save Region</h3>
      <label class="modal-label">Name
        <input id="regionNameInput" type="text" placeholder="e.g. healthbar" spellcheck="false" autocomplete="off">
      </label>
      <label class="modal-label">Description (optional)
        <input id="regionDescInput" type="text" placeholder="Player health bar" spellcheck="false" autocomplete="off">
      </label>
      <div class="modal-coords" id="regionCoords"></div>
      <div class="modal-actions">
        <button id="regionNameCancel" class="btn">Cancel</button>
        <button id="regionNameSave" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="ssTooltip" class="ss-tooltip hidden"></div>
  <div id="toolInfoTooltip" class="tool-info-tooltip hidden"></div>

  <!-- Deps order: utils → screenspace leaf helpers → chrome → settings → page script -->
  <script src="utils.js" defer></script>
  <script src="motion.js" defer></script>
  <script src="screenspace-utils.js" defer></script>
  <script src="export-actions.js" defer></script>
  <script src="topnav.js" defer></script>
  <script src="start-overlay.js" defer></script>
  <script src="dev-token-tweak.js" defer data-dev-only></script>
  <script src="color-picker.js" defer></script>
  <script src="settings-modal.js" defer></script>
  <script src="video-controls.js" defer></script>
  <script src="screenspace.js" defer></script>
  <script src="screenspace-model-view.js" defer></script>
  <script src="screenspace-overlay-interaction.js" defer></script>
  <script src="screenspace-overlay.js" defer></script>
  <script src="screenspace-timeline.js" defer></script>
  <script src="screenspace-tasks.js" defer></script>
  <script src="screenspace-multitool-params.js" defer></script>
  <script src="screenspace-calibration.js" defer></script>
  <script src="screenspace-color.js" defer></script>
  <script src="screenspace-results.js" defer></script>
</body>
</html>
