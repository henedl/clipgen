<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Gallery</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%230a0a0a' stroke-width='11' stroke-linecap='square' stroke-linejoin='miter'><path d='M 18 18 L 82 18 L 82 82'/><path d='M 18 40 L 60 40 L 60 82'/><path d='M 18 62 L 38 62 L 38 82'/></svg>">
  <link rel="stylesheet" href="tokens.css" data-dev-only>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <!-- Gallery shell; artifact JSON is injected immediately before scripts. -->
  <header id="pageHeader">
    <div id="pageHeaderTop">
      <h1><span class="brand-mark" aria-hidden="true"></span>clipgen <span class="header-light">Gallery</span></h1>
      <button id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <span class="theme-toggle-icon theme-icon-sun"></span>
        <span class="theme-toggle-icon theme-icon-moon"></span>
      </button>
    </div>
    <div id="headerMeta">
      <span id="sourceVideo"></span>
      <span id="generatedAt"></span>
    </div>
  </header>

  <section id="galleryInfo">
  <!-- Counts + interval row -->

    <span id="artifactCount"></span>
    <span id="intervalInfo"></span>
  </section>

  <section id="galleryGrid"></section>

  <div id="emptyState" class="hidden">
    <p>No gallery artifacts were generated.</p>
  </div>

  <div id="lightbox" class="hidden" role="dialog" aria-label="Image viewer">
    <button id="lightboxClose" type="button" aria-label="Close">&times;</button>
    <button id="lightboxPrev" type="button" aria-label="Previous">&lsaquo;</button>
    <div id="lightboxContent"></div>
    <button id="lightboxNext" type="button" aria-label="Next">&rsaquo;</button>
    <div id="lightboxCaption"></div>
  </div>

  <!-- CLIPGEN_DATA_HERE -->
  <script src="utils.js" defer></script>
  <script src="dev-token-tweak.js" defer data-dev-only></script>
  <script src="gallery.js" defer></script>
</body>
</html>
