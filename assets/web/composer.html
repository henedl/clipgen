<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Composer</title>
  <!-- CLIPGEN_HEAD_HERE -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="topnav.css">
  <link rel="stylesheet" href="composer.css">
  <link rel="stylesheet" href="card-scrubber.css">
  <link rel="stylesheet" href="settings-modal.css">
  <link rel="stylesheet" href="hotkeys.css">
  <link rel="stylesheet" href="command-palette.css">
  <link rel="stylesheet" href="color-picker.css">
  <link rel="stylesheet" href="start-overlay.css">
</head>
<body data-frontend="composer">
  <!-- Shared chrome: TopNav + start overlay -->
  <topnav-mount data-frontend="composer"></topnav-mount>
  <start-overlay-mount></start-overlay-mount>

  <!-- Full-width glassy subheader: participant picker, transport, cut + lane
       controls. Fixed under the TopNav (shared subheader chrome in tokens.css). -->
  <header id="coToolbar" class="subheader">
    <label class="co-toolbar-label" for="coParticipantSelect">Source</label>
    <select id="coParticipantSelect" aria-label="Source" disabled></select>
    <span id="coVideoInfo" class="co-video-info"></span>
    <span class="co-toolbar-sep"></span>
    <!-- Undo / redo: the cut-edit stack (⌘Z/⌘⇧Z) surfaced as buttons; disabled
         state tracks the hub's _undoStack/_redoStack via syncUndoButtons(). -->
    <button id="coUndoBtn" class="btn btn-small co-icon-btn" type="button" disabled
            data-hotkey="edit.undo" aria-label="Undo" title="Undo">
      <span class="co-btn-icon co-icon-undo" aria-hidden="true"></span>
    </button>
    <button id="coRedoBtn" class="btn btn-small co-icon-btn" type="button" disabled
            data-hotkey="edit.redo" aria-label="Redo" title="Redo">
      <span class="co-btn-icon co-icon-redo" aria-hidden="true"></span>
    </button>
    <div class="co-toolbar-spacer"></div>
    <button id="coGenerateBtn" class="btn btn-small btn-primary" type="button" disabled
            data-hotkey="global.primary" title="Generate clips from all cuts for this participant">Generate clips</button>
    <button id="coCancelBtn" class="btn btn-small hidden" type="button"
            title="Cancel generation">Cancel</button>
    <!-- Keyboard shortcuts: opens the shared hotkeys.js cheatsheet. -->
    <button id="coShortcutsBtn" class="btn btn-small hk-help-btn" type="button"
            data-hotkeys-help data-hotkey="global.cheatsheet"
            aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">
      <span class="hk-help-icon" aria-hidden="true"></span>
    </button>
  </header>

  <main id="coShell">
    <section id="coStage" aria-label="Video">
      <!-- Annotation toolbar: tools (V/T/D/U/C + eraser), hide toggle, color
           swatches + picker, span-gated exports. Floats over the stage's
           top-left. -->
      <div id="coAnnotateBar" class="hidden" role="toolbar" aria-label="Annotate">
        <button id="coToolSelect" class="co-tool-btn active" type="button"
                data-tool="select" data-hotkey="composer.toolSelect" title="Select / move annotations">
          <span class="co-btn-icon co-icon-cursor" aria-hidden="true"></span>
        </button>
        <button id="coToolText" class="co-tool-btn" type="button"
                data-tool="text" data-hotkey="composer.toolText" title="Add text. Click the video to place">
          <span class="co-btn-icon co-icon-text" aria-hidden="true"></span>
        </button>
        <button id="coToolDraw" class="co-tool-btn" type="button"
                data-tool="draw" data-hotkey="composer.toolDraw" title="Freehand draw">
          <span class="co-btn-icon co-icon-draw" aria-hidden="true"></span>
        </button>
        <button id="coToolRect" class="co-tool-btn" type="button"
                data-tool="rect" data-hotkey="composer.toolRect" title="Rectangle. Drag on the video to place">
          <span class="co-shape-glyph co-shape-rect" aria-hidden="true"></span>
        </button>
        <button id="coToolEllipse" class="co-tool-btn" type="button"
                data-tool="ellipse" data-hotkey="composer.toolEllipse" title="Circle. Drag on the video to place">
          <span class="co-shape-glyph co-shape-ellipse" aria-hidden="true"></span>
        </button>
        <button id="coToolErase" class="co-tool-btn" type="button"
                data-tool="erase" data-hotkey="composer.toolErase" title="Eraser. Click or drag over annotations">
          <span class="co-btn-icon co-icon-erase" aria-hidden="true"></span>
        </button>
        <button id="coToolHide" class="co-tool-btn" type="button" aria-pressed="false"
                data-hotkey="composer.holdHideAnnotations"
                title="Hide annotations (hold to peek, tap to toggle)">
          <span class="co-btn-icon co-icon-eye-slash" aria-hidden="true"></span>
        </button>
        <span class="co-toolbar-sep"></span>
        <div id="coAnnotateColors" class="co-annotate-colors" role="group"
             aria-label="Annotation color"></div>
        <span class="co-toolbar-sep"></span>
        <div id="coAnnotateStroke" class="co-annotate-stroke" role="group"
             aria-label="Stroke">
          <button id="coStrokeWidthBtn" class="co-tool-btn co-stroke-trigger"
                  type="button" aria-haspopup="true" aria-expanded="false"
                  title="Stroke width">
            <span class="co-stroke-preview co-stroke-width-preview" aria-hidden="true"></span>
          </button>
          <button id="coStrokeStyleBtn" class="co-tool-btn co-stroke-trigger"
                  type="button" aria-haspopup="true" aria-expanded="false"
                  title="Stroke style">
            <span class="co-stroke-preview co-stroke-style-preview" aria-hidden="true"></span>
          </button>
        </div>
        <span class="co-toolbar-sep"></span>
        <button id="coExportShotBtn" class="btn btn-small" type="button"
                title="Export an annotated screenshot at the playhead">Shot</button>
        <button id="coExportGifBtn" class="btn btn-small" type="button"
                title="Export an annotated GIF of the selected cut's span">GIF</button>
        <button id="coExportBurnBtn" class="btn btn-small" type="button"
                title="Burn annotations into a clip of the selected cut's span">Burn</button>
      </div>
      <div id="coVideoFrame">
        <video id="coVideo" preload="metadata" playsinline></video>
        <!-- Annotation overlay: positioned over the video's content box
             (letterbox-aware) by composer-annotate.js; normalized 0..1
             geometry maps 1:1 onto this canvas. -->
        <canvas id="coAnnotateCanvas"></canvas>
        <input id="coAnnotateText" type="text" class="hidden" autocomplete="off"
               placeholder="Type, then Enter" aria-label="Annotation text">
        <div id="coVideoEmpty" class="co-video-empty">
          <p>Select a participant to load their source video</p>
          <p class="co-empty-sub">Set in/out pairs on the timeline below, toggle
            Sheet / Screenspace / Transcript markers, then generate clips.</p>
        </div>
      </div>
    </section>

    <aside id="coCutPanel" aria-label="Timelines" data-open="true">
      <!-- One tab per timeline: the Composer cuts plus the three read-only
           marker sources. Every list item seeks the playhead to its in point. -->
      <button id="coCutPanelToggle" type="button" aria-label="Toggle timelines sidebar"
              aria-expanded="true" title="Collapse / expand timelines" data-hotkey="composer.toggleSidebar"><span class="co-panel-toggle-icon" aria-hidden="true"></span></button>
      <div class="co-panel-tabs" role="tablist" aria-label="Timeline lists">
        <button class="co-panel-tab active" type="button" role="tab"
                aria-selected="true" data-tab="cuts">Cuts</button>
        <button class="co-panel-tab" type="button" role="tab"
                aria-selected="false" data-tab="sheet">Sheet</button>
        <button class="co-panel-tab" type="button" role="tab"
                aria-selected="false" data-tab="screenspace" title="Screenspace">Screen</button>
        <button class="co-panel-tab" type="button" role="tab"
                aria-selected="false" data-tab="transcript" title="Transcript">Script</button>
      </div>
      <div id="coCutList" class="co-cut-list" role="tabpanel">
        <p class="co-empty-hint">Press <kbd>I</kbd> then <kbd>O</kbd> to add a cut.</p>
      </div>
    </aside>
  </main>

  <section id="coTimelineSection" aria-label="Timeline">
    <div id="coTimelineControls">
      <button id="coPlayBtn" class="co-player-btn" type="button" disabled
              data-hotkey="transport.playPause" aria-label="Play/Pause" title="Play/Pause">
        <span id="coPlayIcon" class="co-btn-icon co-icon-play" aria-hidden="true"></span>
      </button>
      <button id="coMuteBtn" class="co-player-btn" type="button" disabled
              aria-label="Toggle mute" title="Mute · hover for volume">
        <span id="coMuteIcon" class="co-btn-icon co-icon-mute" aria-hidden="true"></span>
      </button>
      <span id="coTimeLabel" class="co-time">0:00 / 0:00</span>
      <span class="co-toolbar-sep"></span>
      <button id="coSetInBtn" class="btn btn-small btn-icon" type="button" disabled
              data-hotkey="composer.setIn" title="Set in point at playhead">
        <span class="co-btn-icon co-icon-in" aria-hidden="true"></span>In
      </button>
      <button id="coSetOutBtn" class="btn btn-small btn-icon" type="button" disabled
              data-hotkey="composer.setOut" title="Set out point to commit the cut">
        <span class="co-btn-icon co-icon-out" aria-hidden="true"></span>Out
      </button>
      <span id="coPendingInfo" class="co-pending-info" aria-live="polite"></span>
      <div class="co-controls-right">
        <!-- Marker-lane toggles: one checkbox per data source (1/2/3). Colors
             come from the shared --stream-* tokens so lanes match the
             Convergence Browser. -->
        <div class="co-lane-checks" role="group" aria-label="Marker sources">
          <label id="coLaneSheet" class="co-lane-check" data-source="sheet"
                 data-hotkey="composer.toggleSource" data-hotkey-combo="0"
                 title="Toggle Sheet markers">
            <input type="checkbox" checked autocomplete="off" tabindex="-1">Sheet
          </label>
          <label id="coLaneScreenspace" class="co-lane-check" data-source="screenspace"
                 data-hotkey="composer.toggleSource" data-hotkey-combo="1"
                 title="Toggle Screenspace markers">
            <input type="checkbox" checked autocomplete="off" tabindex="-1">Screenspace
          </label>
          <label id="coLaneTranscript" class="co-lane-check" data-source="transcript"
                 data-hotkey="composer.toggleSource" data-hotkey-combo="2"
                 title="Toggle Transcript markers">
            <input type="checkbox" checked autocomplete="off" tabindex="-1">Transcript
          </label>
        </div>
        <span class="co-toolbar-sep"></span>
        <!-- Marker-media toggles: thumbnail strips in marker/cut bars, and
             hover audio scrub + waveform. Both persist via PUT api/ui. -->
        <div class="co-lane-checks" role="group" aria-label="Marker media">
          <label id="coThumbsToggle" class="co-lane-check co-media-check"
                 data-hotkey="composer.toggleThumbs"
                 title="Toggle thumbnail strips on markers and cuts">
            <input type="checkbox" autocomplete="off" tabindex="-1">Thumbs
          </label>
          <label id="coScrubAudioToggle" class="co-lane-check co-media-check"
                 data-hotkey="composer.toggleScrubAudio"
                 title="Toggle hover audio scrub + waveform on markers and cuts">
            <input type="checkbox" autocomplete="off" tabindex="-1">Scrub
          </label>
        </div>
        <!-- Camera toggle: when on, seeking/playback pans the zoomed timeline
             to keep the playhead in view. Persists via PUT api/ui. -->
        <div class="co-lane-checks" role="group" aria-label="Playback">
          <label id="coFollowToggle" class="co-lane-check co-media-check"
                 title="Follow the playhead: pan the zoomed timeline to keep it in view during playback">
            <input type="checkbox" checked autocomplete="off" tabindex="-1">Follow
          </label>
        </div>
        <span class="co-toolbar-sep"></span>
        <button id="coZoomInBtn" class="btn btn-small btn-icon" type="button"
                aria-label="Zoom in" title="Zoom in"></button>
        <button id="coZoomOutBtn" class="btn btn-small btn-icon" type="button"
                aria-label="Zoom out" title="Zoom out"></button>
        <button id="coZoomResetBtn" class="btn btn-small" type="button">Reset</button>
      </div>
    </div>
    <div id="coTimelineWrapper">
      <canvas id="coTimelineCanvas"></canvas>
      <canvas id="coPlayheadCanvas"></canvas>
      <!-- Per-lane fold buttons, absolutely positioned over the canvas's left
           edge (screenspace boundaryFlagRail pattern: rail ignores pointer
           events, each button owns its own). -->
      <div id="coLaneRail"></div>
    </div>
    <div id="coTimelineFooter">
      <span class="co-timeline-hint">scroll to zoom · drag to pan · drag cut edges to trim</span>
    </div>
  </section>

  <div id="coTooltip" class="co-tooltip hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <!-- Artifact log: session record of generated clips, toggled by the TopNav
       #logBtn. Same modal structure and .log-* styling as Studio's log. -->
  <div id="logOverlay" class="hidden">
    <div class="log-panel" role="dialog" aria-modal="true" aria-labelledby="logTitle">
      <div class="log-header">
        <h3 id="logTitle">Artifact Log</h3>
        <button id="logClose" class="btn btn-small" type="button">Close</button>
      </div>
      <div id="logContent"></div>
      <div class="log-footer">
        <span id="logCount"></span>
      </div>
    </div>
  </div>

  <!-- Deps order: utils → chrome → settings → card-scrubber (audio/waveform
       primitives, before the hub like studio.html) → page hub → composer-*.js
       satellites. composer-markers.js loads before composer-timeline.js; the
       timeline only reads marker state through CO.state either way.
       composer-scrub.js loads last: the timeline reaches it late-bound via
       CO.drawMarkerThumbs / CO.scrubHoverMove. -->
  <script src="utils.js" defer></script>
  <script src="hotkeys.js" defer></script>
  <script src="motion.js" defer></script>
  <script src="export-actions.js" defer></script>
  <script src="topnav.js" defer></script>
  <script src="start-overlay.js" defer></script>
  <script src="dev-token-tweak.js" defer data-dev-only></script>
  <script src="color-picker.js" defer></script>
  <script src="settings-modal.js" defer></script>
  <script src="command-palette.js" defer></script>
  <script src="intake-cluster.js" defer></script>
  <script src="card-scrubber.js" defer></script>
  <script src="video-controls.js" defer></script>
  <script src="composer.js" defer></script>
  <script src="composer-markers.js" defer></script>
  <script src="composer-timeline.js" defer></script>
  <script src="composer-annotate.js" defer></script>
  <script src="composer-scrub.js" defer></script>
</body>
</html>
