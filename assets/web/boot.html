<!doctype html>
<!--
  Boot page, served by the WSGI dispatcher in server.py while the real Flask
  app is still being built (av/cv2 preload + blueprint imports — tens of
  seconds on a cold machine). It polls /api/boot-status and reloads into the
  real page once the build swaps in.

  Standing exception to the tokens.css / no-hardcoded-hex rules: this page must
  be fully self-contained (inline CSS + ES5 JS, no external fetches) because
  the boot dispatcher serves no /icons/, /logos/, tokens.css, fonts, or utils.js
  routes. Color values mirror tokens.css --bg/--fg/--fg-muted for both themes;
  the dark background also matches desktop.py's _WINDOW_BACKGROUND.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clipgen — starting</title>
<!-- CLIPGEN_BOOT_CHROME -->
<script>
  // Mirror utils.js applyStoredThemePreference without depending on utils.js.
  (function () {
    var stored = null;
    try { stored = window.localStorage.getItem("clipgen-theme"); } catch (e) {}
    if (stored === "light") {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
<style>
  html { background: #0a0a0b; color: #ffffff; color-scheme: dark; }
  html[data-theme="light"] { background: #fafafa; color: #14151a; color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .boot {
    text-align: center;
    /* Optically centered slightly above the middle, like a native splash. */
    transform: translateY(-8vh);
  }
  .boot-wordmark {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: 0.02em;
    margin-bottom: 28px;
  }
  /* Looping brand mark; inlined because boot loads no stylesheet.
     Mirrors assets/logos/favicon.svg. */
  .boot-mark {
    width: 40px;
    height: 40px;
    margin: 0 auto 20px;
  }
  .boot-mark svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Offsets run 3L (hidden) to 2L (drawn) to L (travelled off the end),
     where L is the path length. Never negative: WebKit renders a negative
     stroke-dashoffset as its absolute value, which rewinds the draw
     instead of continuing it. Shifting up one dash period avoids that. */
  .boot-mark__line {
    fill: none;
    stroke: currentColor;
    stroke-width: 13;
    stroke-linecap: square;
    stroke-linejoin: miter;
    stroke-dasharray: var(--boot-mark-len);
    stroke-dashoffset: var(--boot-mark-in);
    animation: boot-mark-draw 2.6s linear infinite;
  }
  /* Cascade at 0/350/700ms: draw 400ms, hold 250ms, travel out
     450ms, beat, repeat. */
  .boot-mark__line--1 { --boot-mark-len: 128; --boot-mark-in: 384; --boot-mark-drawn: 256; --boot-mark-out: 128; animation-delay:    0s; }
  .boot-mark__line--2 { --boot-mark-len:  84; --boot-mark-in: 252; --boot-mark-drawn: 168; --boot-mark-out:  84; animation-delay: 350ms; }
  .boot-mark__line--3 { --boot-mark-len:  40; --boot-mark-in: 120; --boot-mark-drawn:  80; --boot-mark-out:  40; animation-delay: 700ms; }
  @keyframes boot-mark-draw {
    0%    { stroke-dashoffset: var(--boot-mark-in);
            animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    15.4% { stroke-dashoffset: var(--boot-mark-drawn); }
    51.9% { stroke-dashoffset: var(--boot-mark-drawn);
            animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
    69.2% { stroke-dashoffset: var(--boot-mark-out); }
    100%  { stroke-dashoffset: var(--boot-mark-out); }
  }
  @media (prefers-reduced-motion: reduce) {
    .boot-mark__line { animation: none; stroke-dashoffset: 0; }
  }
  .boot-msg {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.62);
    min-height: 18px;
  }
  html[data-theme="light"] .boot-msg { color: rgba(20, 21, 26, 0.68); }
  /* Local copy of tokens.css .cg-shimmer; this page loads no
     stylesheet. Keep synced. */
  .cg-shimmer {
    display: inline-block;
    background-image: linear-gradient(90deg,
      rgba(255, 255, 255, 0.38) 0%,
      rgba(255, 255, 255, 0.38) 18%,
      rgba(255, 255, 255, 0.68) 50%,
      rgba(255, 255, 255, 0.38) 67%,
      rgba(255, 255, 255, 0.38) 100%);
    background-size: 200% 100%;
    background-repeat: repeat;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: cg-shimmer-sweep 1s linear infinite;
  }
  html[data-theme="light"] .cg-shimmer {
    background-image: linear-gradient(90deg,
      rgba(20, 21, 26, 0.45) 0%,
      rgba(20, 21, 26, 0.45) 18%,
      rgba(20, 21, 26, 0.85) 50%,
      rgba(20, 21, 26, 0.45) 67%,
      rgba(20, 21, 26, 0.45) 100%);
  }
  @keyframes cg-shimmer-sweep {
    from { background-position:    0% 0; }
    to   { background-position: -200% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cg-shimmer {
      animation: none;
      background-image: none;
      color: rgba(255, 255, 255, 0.62);
      -webkit-text-fill-color: rgba(255, 255, 255, 0.62);
    }
    html[data-theme="light"] .cg-shimmer {
      background-image: none;
      color: rgba(20, 21, 26, 0.68);
      -webkit-text-fill-color: rgba(20, 21, 26, 0.68);
    }
  }
  .boot-elapsed {
    margin-top: 6px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.28);
  }
  html[data-theme="light"] .boot-elapsed { color: rgba(20, 21, 26, 0.32); }
  .boot-err {
    display: none;
    margin: 16px auto 0;
    max-width: 420px;
    font-size: 12px;
    line-height: 1.5;
    color: #e5534b;
    white-space: pre-wrap;
    word-break: break-word;
  }
  /* Native window host: pad below the hidden-titlebar chrome bar and give the
     bar region a drag handle so the window can be moved during boot. */
  .boot-drag { display: none; }
  html[data-desktop-chrome] .boot-drag {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--desktop-chrome-height, 38px);
  }
</style>
</head>
<body>
<div class="boot-drag pywebview-drag-region"></div>
<div class="boot">
  <div class="boot-wordmark">clipgen</div>
  <div class="boot-mark" id="bootMark" aria-hidden="true">
    <svg viewBox="0 0 100 100" focusable="false">
      <path class="boot-mark__line boot-mark__line--1" d="M 18 18 L 82 18 L 82 82"/>
      <path class="boot-mark__line boot-mark__line--2" d="M 18 40 L 60 40 L 60 82"/>
      <path class="boot-mark__line boot-mark__line--3" d="M 18 62 L 38 62 L 38 82"/>
    </svg>
  </div>
  <div class="boot-msg cg-shimmer" id="bootMsg">Starting clipgen&#8230;</div>
  <div class="boot-elapsed" id="bootElapsed"></div>
  <div class="boot-err" id="bootErr"></div>
</div>
<script>
  (function () {
    var msgEl = document.getElementById("bootMsg");
    var errEl = document.getElementById("bootErr");
    var elapsedEl = document.getElementById("bootElapsed");
    var markEl = document.getElementById("bootMark");
    var started = Date.now();
    var stopped = false;

    function tickElapsed() {
      if (stopped) return;
      var secs = Math.floor((Date.now() - started) / 1000);
      // Only show the counter once the wait is long enough to wonder about.
      elapsedEl.textContent = secs >= 3 ? secs + "s" : "";
      window.setTimeout(tickElapsed, 1000);
    }
    tickElapsed();

    function pollDelay() {
      // A warm build finishes inside one 500ms interval, so a fixed poll
      // wasted a mean ~250ms between build-ready and the swap. Poll fast
      // while a fast boot is still plausible, then back off for the cold
      // multi-second case (the requests are answered by a bare dispatcher;
      // 150ms polling costs nothing measurable).
      return Date.now() - started < 2000 ? 150 : 500;
    }

    function poll() {
      if (stopped) return;
      fetch("/api/boot-status", { cache: "no-store" })
        .then(function (resp) { return resp.json(); })
        .then(function (data) {
          if (data.ready) {
            stopped = true;
            // Served at the real page's own path, so a reload lands there.
            window.location.reload();
            return;
          }
          if (data.error) {
            stopped = true;
            markEl.style.display = "none";
            msgEl.classList.remove("cg-shimmer");
            msgEl.textContent = "clipgen failed to start";
            errEl.textContent = data.error;
            errEl.style.display = "block";
            return;
          }
          if (data.message) msgEl.textContent = data.message;
          window.setTimeout(poll, pollDelay());
        })
        .catch(function () {
          // Server not answering yet (or a blip mid-boot): keep trying.
          window.setTimeout(poll, pollDelay());
        });
    }
    poll();
  })();
</script>
</body>
</html>
