<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Studio</title>
  <link rel="icon" type="image/svg+xml" href="logos/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="logos/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="logos/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logos/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="logos/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="logos/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="logos/apple-touch-icon-120.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="topnav.css">
  <link rel="stylesheet" href="primitives.css">
  <link rel="stylesheet" href="studio.css">
  <link rel="stylesheet" href="settings-modal.css">
  <link rel="stylesheet" href="convergence.css">
  <link rel="stylesheet" href="metadata.css">
</head>
<body data-frontend="studio">
  <topnav-mount data-frontend="studio"></topnav-mount>

  <div id="studioSubheader">
    <div class="subheader-left">
      <span id="studyName"></span>
      <span id="versionInfo"></span>
    </div>
    <div class="subheader-tabs" role="tablist">
      <button class="preview-tab active" data-tab="sheet">Sheet</button>
      <button class="preview-tab hidden" data-tab="intake"><span id="intakeTabDot" class="tab-status-dot hidden" aria-hidden="true"></span>Screenspace Intake <span id="intakeTabBadge" class="intake-tab-badge hidden">0</span></button>
      <button class="preview-tab hidden" data-tab="transcript-intake"><span id="trIntakeTabDot" class="tab-status-dot hidden" aria-hidden="true"></span>Transcript Intake <span id="trIntakeTabBadge" class="intake-tab-badge hidden">0</span></button>
      <button class="preview-tab hidden" data-tab="convergence">Convergence</button>
      <button class="preview-tab" data-tab="metadata">Metadata</button>
    </div>
    <div class="subheader-actions">
      <button id="buildTimelineViewerBtn" class="btn btn-small btn-icon">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M1 3.5C1 2.67157 1.67157 2 2.5 2H13.5C14.3284 2 15 2.67157 15 3.5V12.5C15 13.3284 14.3284 14 13.5 14H2.5C1.67157 14 1 13.3284 1 12.5V3.5ZM2.5 3.75C2.5 3.61193 2.61193 3.5 2.75 3.5H4.25C4.38807 3.5 4.5 3.61193 4.5 3.75V4.75C4.5 4.88807 4.38807 5 4.25 5H2.75C2.61193 5 2.5 4.88807 2.5 4.75V3.75ZM6.25 3.5C6.11193 3.5 6 3.61193 6 3.75V7.25C6 7.38807 6.11193 7.5 6.25 7.5H9.75C9.88807 7.5 10 7.38807 10 7.25V3.75C10 3.61193 9.88807 3.5 9.75 3.5H6.25ZM6 8.75C6 8.61193 6.11193 8.5 6.25 8.5H9.75C9.88807 8.5 10 8.61193 10 8.75V12.25C10 12.3881 9.88807 12.5 9.75 12.5H6.25C6.11193 12.5 6 12.3881 6 12.25V8.75ZM11.75 3.5C11.6119 3.5 11.5 3.61193 11.5 3.75V4.75C11.5 4.88807 11.6119 5 11.75 5H13.25C13.3881 5 13.5 4.88807 13.5 4.75V3.75C13.5 3.61193 13.3881 3.5 13.25 3.5H11.75ZM2.5 11.25C2.5 11.1119 2.61193 11 2.75 11H4.25C4.38807 11 4.5 11.1119 4.5 11.25V12.25C4.5 12.3881 4.38807 12.5 4.25 12.5H2.75C2.61193 12.5 2.5 12.3881 2.5 12.25V11.25ZM11.75 11C11.6119 11 11.5 11.1119 11.5 11.25V12.25C11.5 12.3881 11.6119 12.5 11.75 12.5H13.25C13.3881 12.5 13.5 12.3881 13.5 12.25V11.25C13.5 11.1119 13.3881 11 13.25 11H11.75ZM2.5 8.75C2.5 8.61193 2.61193 8.5 2.75 8.5H4.25C4.38807 8.5 4.5 8.61193 4.5 8.75V9.75C4.5 9.88807 4.38807 10 4.25 10H2.75C2.61193 10 2.5 9.88807 2.5 9.75V8.75ZM11.75 8.5C11.6119 8.5 11.5 8.61193 11.5 8.75V9.75C11.5 9.88807 11.6119 10 11.75 10H13.25C13.3881 10 13.5 9.88807 13.5 9.75V8.75C13.5 8.61193 13.3881 8.5 13.25 8.5H11.75ZM2.5 6.25C2.5 6.11193 2.61193 6 2.75 6H4.25C4.38807 6 4.5 6.11193 4.5 6.25V7.25C4.5 7.38807 4.38807 7.5 4.25 7.5H2.75C2.61193 7.5 2.5 7.38807 2.5 7.25V6.25ZM11.75 6C11.6119 6 11.5 6.11193 11.5 6.25V7.25C11.5 7.38807 11.6119 7.5 11.75 7.5H13.25C13.3881 7.5 13.5 7.38807 13.5 7.25V6.25C13.5 6.11193 13.3881 6 13.25 6H11.75Z"/>
        </svg>
        Timeline Viewer
      </button>
      <div class="gallery-group">
        <button id="galleryBtn" class="btn btn-small btn-icon" title="Generate a gallery viewer from a participant's source video">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M2 4C2 2.89543 2.89543 2 4 2H12C13.1046 2 14 2.89543 14 4V12C14 13.1046 13.1046 14 12 14H4C2.89543 14 2 13.1046 2 12V4ZM12.5 9.70711C12.5 9.5745 12.4473 9.44732 12.3536 9.35355L11.3536 8.35355C11.1583 8.15829 10.8417 8.15829 10.6464 8.35355L9.35355 9.64645C9.15829 9.84171 8.84171 9.84171 8.64645 9.64645L6.35355 7.35355C6.15829 7.15829 5.84171 7.15829 5.64645 7.35355L3.64645 9.35355C3.55268 9.44732 3.5 9.5745 3.5 9.70711V12C3.5 12.2761 3.72386 12.5 4 12.5H12C12.2761 12.5 12.5 12.2761 12.5 12V9.70711ZM12 5C12 5.55228 11.5523 6 11 6C10.4477 6 10 5.55228 10 5C10 4.44772 10.4477 4 11 4C11.5523 4 12 4.44772 12 5Z"/>
          </svg>
          Gallery Viewer
        </button>
        <div id="galleryDrawer" class="gallery-drawer">
          <label class="gallery-drawer-label">Source
            <select id="galleryParticipant" class="gallery-drawer-select"></select>
          </label>
          <label class="gallery-drawer-label">Format
            <select id="galleryFormat" class="gallery-drawer-select">
              <option value="screen">Screenshot</option>
              <option value="gif">GIF</option>
            </select>
          </label>
          <label class="gallery-drawer-label">Interval (s)
            <input id="galleryInterval" type="number" min="1" step="1" value="10" class="gallery-drawer-input">
          </label>
          <label class="gallery-drawer-label gallery-drawer-bundle">
            <input id="galleryBundle" type="checkbox" class="gallery-drawer-checkbox" autocomplete="off">
            Bundle
          </label>
        </div>
      </div>
      <button id="filterToggle" class="btn btn-small btn-icon" title="Filter rows">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M14 2C14 1.44772 13.5523 1 13 1H3C2.44772 1 2 1.44772 2 2V4.17157C2 4.70201 2.21071 5.21071 2.58579 5.58579L5.41421 8.41421C5.78929 8.78929 6 9.29799 6 9.82843V14.191C6 14.5627 6.39116 14.8044 6.72361 14.6382L8.89443 13.5528C9.572 13.214 10 12.5215 10 11.7639V9.82843C10 9.29799 10.2107 8.78929 10.5858 8.41421L13.4142 5.58579C13.7893 5.21071 14 4.70201 14 4.17157V2Z"/>
        </svg>
        Filter
      </button>
      <button id="refreshSheet" class="btn btn-small btn-icon" title="Refresh sheet data from source">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M13.8356 2.47703C14.2498 2.47703 14.5856 2.81282 14.5856 3.22703V6.40901C14.5856 6.82322 14.2498 7.15901 13.8356 7.15901H10.6536C10.2394 7.15901 9.90362 6.82322 9.90362 6.40901C9.90362 5.9948 10.2394 5.65901 10.6536 5.65901H12.0249L11.1839 4.81802C9.42659 3.06066 6.57734 3.06066 4.81999 4.81802C4.53421 5.10379 4.29556 5.41752 4.10337 5.74996C3.89606 6.10855 3.43729 6.23119 3.07869 6.02388C2.7201 5.81656 2.59746 5.3578 2.80477 4.9992C3.06184 4.55455 3.38024 4.13644 3.75933 3.75736C6.10247 1.41421 9.90146 1.41421 12.2446 3.75736L13.0856 4.59835V3.22703C13.0856 2.81282 13.4214 2.47703 13.8356 2.47703ZM12.925 9.97662C13.2836 10.184 13.4062 10.6427 13.1989 11.0013C12.9418 11.4458 12.6235 11.8637 12.2446 12.2426C9.90146 14.5858 6.10247 14.5858 3.75933 12.2426L2.91833 11.4017V12.773C2.91833 13.1872 2.58255 13.523 2.16834 13.523C1.75412 13.523 1.41834 13.1872 1.41834 12.773L1.41833 9.59099C1.41833 9.17678 1.75412 8.84099 2.16833 8.84099H5.35031C5.76453 8.84099 6.10032 9.17678 6.10032 9.59099C6.10032 10.0052 5.76453 10.341 5.35032 10.341H3.97899L4.81999 11.182C6.57734 12.9393 9.42659 12.9393 11.1839 11.182C11.4696 10.8963 11.7082 10.5827 11.9003 10.2504C12.1077 9.89186 12.5665 9.76927 12.925 9.97662Z"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <section id="sheetPreview">
    <aside id="studioSidebar" data-open="true" aria-label="Sheet filters">
      <button id="studioSidebarToggle" type="button" aria-label="Toggle sidebar"><span class="studio-sidebar-toggle-icon" aria-hidden="true"></span></button>
      <section class="studio-sidebar-section" data-section="views">
        <header class="studio-sidebar-header">Views</header>
        <div class="studio-sidebar-body" data-target="views"></div>
      </section>
      <section class="studio-sidebar-section" data-section="categories">
        <header class="studio-sidebar-header">Categories</header>
        <div class="studio-sidebar-body" data-target="categories"></div>
      </section>
      <section class="studio-sidebar-section" data-section="participants">
        <header class="studio-sidebar-header">Participants</header>
        <div class="studio-sidebar-body" data-target="participants"></div>
      </section>
    </aside>
    <div id="sheetMain">
    <div id="filterBar" class="hidden"></div>
    <div id="sheetGrid">
      <div id="sheetLoading">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row" style="width: 60%"></div>
      </div>
    </div>
    <div id="intakePanel" class="hidden">
      <div class="area-controls" id="intakeControls">
        <label class="intake-cluster-label">Cluster <input id="intakeClusterThreshold" type="number" min="1" max="60" value="5" class="intake-cluster-input">s</label>
        <button id="intakeAddAllBtn" class="cg-btn cg-btn-sm" disabled><span>Add all to Artifacts</span></button>
        <button id="intakeReelAllBtn" class="cg-btn cg-btn-solid cg-btn-sm" disabled><span>Add all to Reel</span></button>
      </div>
      <div class="intake-filters">
        <input id="intakeFilterSearch" type="text" placeholder="Search events&#x2026;" class="intake-filter-search" autocomplete="off">
        <div id="intakeDetectorPills" class="intake-chip-row"></div>
        <div id="intakeFilterParticipants" class="intake-chip-row"></div>
        <label class="intake-filter-new-label"><input id="intakeFilterNew" type="checkbox"> New only</label>
      </div>
      <div id="intakeTimeline" class="intake-density-host"></div>
      <div id="intakeCards" class="intake-cards-grid">
        <div class="drop-target-empty">Screenspace events will appear here</div>
      </div>
    </div>
    <div id="trIntakePanel" class="hidden">
      <div class="area-controls" id="trIntakeControls">
        <label class="intake-cluster-label">Merge gap <input id="trIntakeClusterThreshold" type="number" min="1" max="60" value="5" class="intake-cluster-input">s</label>
        <label class="tr-intake-toggle"><input id="trIntakeShowAll" type="checkbox"> Show all</label>
        <button id="trIntakeAddAllBtn" class="cg-btn cg-btn-sm" disabled><span>Add all to Artifacts</span></button>
        <button id="trIntakeReelAllBtn" class="cg-btn cg-btn-solid cg-btn-sm" disabled><span>Add all to Reel</span></button>
      </div>
      <div class="intake-filters">
        <input id="trIntakeFilterSearch" type="text" placeholder="Search transcript&#x2026;" class="intake-filter-search" autocomplete="off">
        <div id="trIntakeCategoryPills" class="intake-chip-row"></div>
        <div id="trIntakeFilterParticipants" class="intake-chip-row"></div>
      </div>
      <div id="trIntakeTimeline" class="intake-density-host"></div>
      <div id="trIntakeCards" class="intake-cards-grid">
        <div class="drop-target-empty">Transcript marks will appear here</div>
      </div>
    </div>
    <div id="convergencePanel" class="hidden">
      <div id="convergenceControls" class="area-controls"></div>
      <div id="convergenceFilters" class="convergence-filters"></div>
      <div id="convergenceTimeline" class="convergence-timeline-container"></div>
      <div id="convergenceDetail" class="convergence-detail hidden"></div>
    </div>
    <div id="metadataPanel" class="hidden"></div>
    </div>
  </section>

  <div id="panelDivider"><div class="divider-handle"></div></div>

  <div id="bottomPanel">
  <div id="bottomColumns">
  <section id="artifactColumn">
  <section id="dropAreas">
    <div id="artifactsArea" class="drop-area">
      <div class="bs-toolbar" id="artifactsToolbar">
        <span class="bs-label">Artifacts</span>
        <span id="artifactsCount" class="bs-count cg-mono">(0)</span>
        <span id="viewerArtifactCount" class="bs-count cg-mono"></span>
        <svg id="artifactsSpinner" class="title-spinner bs-spinner" width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" opacity="0.25"/><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="20 15" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 7 7" to="360 7 7" dur="0.7s" repeatCount="indefinite"/></circle></svg>
        <select id="artifactFormat" class="bs-select">
          <option value="clip">Clip (.mp4)</option>
          <option value="screen">Screenshot (.png)</option>
          <option value="gif">GIF (.gif)</option>
        </select>
        <label id="titlecardGroup" class="titlecard-group">
          <input id="titlecardEnabled" type="checkbox">
          <span class="titlecard-label-text">Titlecards</span>
          <input id="titlecardDuration" type="number" min="1" step="1" value="2"
                 class="titlecard-duration-input bs-input" title="Duration (seconds)">
          <span class="titlecard-label-unit">s</span>
        </label>
        <div class="bs-actions">
          <button id="generateBtn" class="cg-btn cg-btn-solid cg-btn-sm" disabled data-tooltip="Add cells to the work area first"><span class="cg-btn-icon" data-icon="sparkles"></span><span>Generate</span></button>
          <button id="cancelGenerateBtn" class="cg-btn cg-btn-bare cg-btn-sm hidden">Cancel</button>
          <button id="buildViewerBtn" class="cg-btn cg-btn-sm" disabled data-tooltip="Generate artifacts first"><span class="cg-btn-icon" data-icon="eye"></span><span>Build Viewer</span></button>
          <button id="stashArtifactsBtn" class="cg-btn cg-btn-bare cg-btn-sm" disabled data-tooltip="Add cells to the work area first"><span class="cg-btn-icon" data-icon="archive-box"></span><span>Stash</span></button>
          <button id="clearArtifactsBtn" class="cg-btn cg-btn-bare cg-btn-sm"><span class="cg-btn-icon" data-icon="x-mark"></span><span>Clear</span></button>
        </div>
      </div>
      <div id="artifactsList" class="drop-target">
        <div class="drop-target-empty">Click or drag cells here to queue for generation</div>
      </div>
      <button id="addToReelBtn" class="cg-btn cg-btn-bare cg-btn-sm bs-add-to-reel" disabled data-tooltip="Add cells to the work area first"><span class="cg-btn-icon" data-icon="arrow-down-tray"></span><span>Add to Reel</span></button>
    </div>
  </section>

  <section id="stashedArtifactsArea" class="hidden">
    <div id="stashedArtifactsHeader">
      <h3>Stashes <span id="stashedArtifactsCount">(0)</span></h3>
    </div>
    <div id="stashedArtifactsList"></div>
  </section>
  </section>

  <section id="reelColumn">
  <section id="reelArea">
    <div class="bs-toolbar" id="reelToolbar">
      <span class="bs-label">Reel</span>
      <span id="reelCount" class="bs-count cg-mono">(0)</span>
      <span id="reelDuration" class="bs-count cg-mono"></span>
      <svg id="reelSpinner" class="title-spinner bs-spinner" width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" opacity="0.25"/><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="20 15" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 7 7" to="360 7 7" dur="0.7s" repeatCount="indefinite"/></circle></svg>
      <div class="bs-actions">
        <div class="highlights-group">
          <button id="buildHighlightsBtn" class="cg-btn cg-btn-solid cg-btn-sm" title="Auto-select the best clips scored by severity, uniqueness, and keyword annotations."><span class="cg-btn-icon" data-icon="sparkles"></span><span>Find Highlights</span></button>
          <div id="highlightsDurationDrawer" class="highlights-drawer">
            <label class="highlights-drawer-label">Duration (s)
              <input id="highlightsDuration" type="number" min="10" step="10" value="180" class="highlights-drawer-input bs-input">
            </label>
          </div>
        </div>
        <button id="buildReelBtn" class="cg-btn cg-btn-sm" disabled data-tooltip="Add clips to the reel first"><span class="cg-btn-icon" data-icon="play"></span><span>Build Reel</span></button>
        <button id="cancelReelBtn" class="cg-btn cg-btn-bare cg-btn-sm hidden">Cancel</button>
        <button id="stashReelBtn" class="cg-btn cg-btn-bare cg-btn-sm" disabled data-tooltip="Add clips to the reel first"><span class="cg-btn-icon" data-icon="archive-box"></span><span>Stash</span></button>
        <button id="clearReelBtn" class="cg-btn cg-btn-bare cg-btn-sm"><span class="cg-btn-icon" data-icon="x-mark"></span><span>Clear</span></button>
      </div>
    </div>
    <div id="reelList" class="drop-target">
      <div class="drop-target-empty">Shift+click or drag cells here to build a reel</div>
    </div>
  </section>

  <section id="stashedReelsArea" class="hidden">
    <div id="stashedReelsHeader">
      <h3>Stashes <span id="stashedReelsCount">(0)</span></h3>
    </div>
    <div id="stashedReelsList"></div>
  </section>
  </section>
  </div>

  </div>

  <div id="logOverlay" class="hidden">
    <div class="log-panel">
      <div class="log-header">
        <h3>Artifact Log</h3>
        <button id="logClose" class="btn btn-small">Close</button>
      </div>
      <div id="logContent"></div>
      <div class="log-footer">
        <span id="logCount"></span>
      </div>
    </div>
  </div>

  <div id="statusOverlay" class="hidden">
    <div class="status-card">
      <div id="statusSpinner" class="spinner"></div>
      <h3 id="statusTitle">Processing...</h3>
      <p id="statusMessage"></p>
      <div class="status-actions">
        <button id="statusDismiss" class="btn btn-small hidden">Dismiss</button>
        <button id="statusOpen" class="btn btn-small btn-primary hidden">Open</button>
      </div>
    </div>
  </div>

  <div id="confirmOverlay" class="hidden">
    <div class="confirm-card">
      <h3 id="confirmTitle"></h3>
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button id="confirmNo" class="btn btn-small">Sheet Only</button>
        <button id="confirmYes" class="btn btn-small btn-primary">Include Intake</button>
      </div>
    </div>
  </div>

  <div id="trIntakeTooltip" class="tr-intake-tooltip hidden"></div>
  <script src="utils.js"></script>
  <script src="primitives.js"></script>
  <script src="topnav.js"></script>
  <script src="dev-token-tweak.js" data-dev-only></script>
  <script src="settings-modal.js"></script>
  <script src="grid-bg.js"></script>
  <script src="studio.js"></script>
  <script src="convergence.js"></script>
  <script src="metadata.js"></script>
</body>
</html>
