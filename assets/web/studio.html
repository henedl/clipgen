<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Studio</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="studio.css">
</head>
<body>
  <header id="studioHeader">
    <div id="studioHeaderTop">
      <h1>clipgen <span class="header-light">Studio</span></h1>
      <div id="headerActions">
        <a id="insightsLink" href="/insights/" class="nav-link hidden">Insights Builder</a>
        <a id="screenspaceLink" href="/screenspace/" class="nav-link hidden">Screenspace</a>
        <button id="buildTimelineViewerBtn" class="btn btn-small btn-icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M1 3.5C1 2.67157 1.67157 2 2.5 2H13.5C14.3284 2 15 2.67157 15 3.5V12.5C15 13.3284 14.3284 14 13.5 14H2.5C1.67157 14 1 13.3284 1 12.5V3.5ZM2.5 3.75C2.5 3.61193 2.61193 3.5 2.75 3.5H4.25C4.38807 3.5 4.5 3.61193 4.5 3.75V4.75C4.5 4.88807 4.38807 5 4.25 5H2.75C2.61193 5 2.5 4.88807 2.5 4.75V3.75ZM6.25 3.5C6.11193 3.5 6 3.61193 6 3.75V7.25C6 7.38807 6.11193 7.5 6.25 7.5H9.75C9.88807 7.5 10 7.38807 10 7.25V3.75C10 3.61193 9.88807 3.5 9.75 3.5H6.25ZM6 8.75C6 8.61193 6.11193 8.5 6.25 8.5H9.75C9.88807 8.5 10 8.61193 10 8.75V12.25C10 12.3881 9.88807 12.5 9.75 12.5H6.25C6.11193 12.5 6 12.3881 6 12.25V8.75ZM11.75 3.5C11.6119 3.5 11.5 3.61193 11.5 3.75V4.75C11.5 4.88807 11.6119 5 11.75 5H13.25C13.3881 5 13.5 4.88807 13.5 4.75V3.75C13.5 3.61193 13.3881 3.5 13.25 3.5H11.75ZM2.5 11.25C2.5 11.1119 2.61193 11 2.75 11H4.25C4.38807 11 4.5 11.1119 4.5 11.25V12.25C4.5 12.3881 4.38807 12.5 4.25 12.5H2.75C2.61193 12.5 2.5 12.3881 2.5 12.25V11.25ZM11.75 11C11.6119 11 11.5 11.1119 11.5 11.25V12.25C11.5 12.3881 11.6119 12.5 11.75 12.5H13.25C13.3881 12.5 13.5 12.3881 13.5 12.25V11.25C13.5 11.1119 13.3881 11 13.25 11H11.75ZM2.5 8.75C2.5 8.61193 2.61193 8.5 2.75 8.5H4.25C4.38807 8.5 4.5 8.61193 4.5 8.75V9.75C4.5 9.88807 4.38807 10 4.25 10H2.75C2.61193 10 2.5 9.88807 2.5 9.75V8.75ZM11.75 8.5C11.6119 8.5 11.5 8.61193 11.5 8.75V9.75C11.5 9.88807 11.6119 10 11.75 10H13.25C13.3881 10 13.5 9.88807 13.5 9.75V8.75C13.5 8.61193 13.3881 8.5 13.25 8.5H11.75ZM2.5 6.25C2.5 6.11193 2.61193 6 2.75 6H4.25C4.38807 6 4.5 6.11193 4.5 6.25V7.25C4.5 7.38807 4.38807 7.5 4.25 7.5H2.75C2.61193 7.5 2.5 7.38807 2.5 7.25V6.25ZM11.75 6C11.6119 6 11.5 6.11193 11.5 6.25V7.25C11.5 7.38807 11.6119 7.5 11.75 7.5H13.25C13.3881 7.5 13.5 7.38807 13.5 7.25V6.25C13.5 6.11193 13.3881 6 13.25 6H11.75Z"/>
          </svg>
          Timeline Viewer
        </button>
        <div class="gallery-group">
          <button id="galleryBtn" class="btn btn-small btn-icon" title="Generate a gallery viewer from a participant's source video">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M2 4C2 2.89543 2.89543 2 4 2H12C13.1046 2 14 2.89543 14 4V12C14 13.1046 13.1046 14 12 14H4C2.89543 14 2 13.1046 2 12V4ZM12.5 9.70711C12.5 9.5745 12.4473 9.44732 12.3536 9.35355L11.3536 8.35355C11.1583 8.15829 10.8417 8.15829 10.6464 8.35355L9.35355 9.64645C9.15829 9.84171 8.84171 9.84171 8.64645 9.64645L6.35355 7.35355C6.15829 7.15829 5.84171 7.15829 5.64645 7.35355L3.64645 9.35355C3.55268 9.44732 3.5 9.5745 3.5 9.70711V12C3.5 12.2761 3.72386 12.5 4 12.5H12C12.2761 12.5 12.5 12.2761 12.5 12V9.70711ZM12 5C12 5.55228 11.5523 6 11 6C10.4477 6 10 5.55228 10 5C10 4.44772 10.4477 4 11 4C11.5523 4 12 4.44772 12 5Z"/>
            </svg>
            Gallery Viewer
          </button>
          <div id="galleryDrawer" class="gallery-drawer">
            <label class="gallery-drawer-label">Source
              <select id="galleryParticipant" class="gallery-drawer-select"></select>
            </label>
            <label class="gallery-drawer-label">Format
              <select id="galleryFormat" class="gallery-drawer-select">
                <option value="screen">Screenshot</option>
                <option value="gif">GIF</option>
              </select>
            </label>
            <label class="gallery-drawer-label">Interval (s)
              <input id="galleryInterval" type="number" min="1" step="1" value="10" class="gallery-drawer-input">
            </label>
          </div>
        </div>
        <button id="logBtn" type="button" class="btn btn-small btn-icon" title="Artifact Log">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M11.9862 3H12C13.1045 3 14 3.89543 14 5V11C14 11.9319 13.3626 12.715 12.5 12.937V7C12.5 5.61929 11.3807 4.5 9.99998 4.5H4.06299C4.28501 3.63739 5.06806 3 5.99998 3H6.01371C6.13807 1.87501 7.09184 1 8.24998 1H9.74998C10.9081 1 11.8619 1.87501 11.9862 3ZM10.5 4V3.25C10.5 2.83579 10.1642 2.5 9.74998 2.5H8.24998C7.83577 2.5 7.49998 2.83579 7.49998 3.25V4H10.5Z"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3 6C2.44772 6 2 6.44772 2 7V14C2 14.5523 2.44772 15 3 15H10C10.5523 15 11 14.5523 11 14V7C11 6.44772 10.5523 6 10 6H3ZM4.75 8.5C4.33579 8.5 4 8.83579 4 9.25C4 9.66421 4.33579 10 4.75 10H8.25C8.66421 10 9 9.66421 9 9.25C9 8.83579 8.66421 8.5 8.25 8.5H4.75ZM4 11.75C4 11.3358 4.33579 11 4.75 11H8.25C8.66421 11 9 11.3358 9 11.75C9 12.1642 8.66421 12.5 8.25 12.5H4.75C4.33579 12.5 4 12.1642 4 11.75Z"/>
          </svg>
        </button>
        <button id="settingsBtn" type="button" class="btn btn-small btn-icon" title="Settings">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M6.45498 1.45025C6.48054 1.19465 6.69562 1 6.9525 1H9.04751C9.30438 1 9.51947 1.19465 9.54503 1.45025L9.73077 3.30766C10.2693 3.50637 10.7642 3.79513 11.1973 4.15568L12.9001 3.38721C13.1342 3.28155 13.4103 3.37049 13.5387 3.59295L14.5863 5.40728C14.7147 5.62975 14.6537 5.91334 14.4451 6.06327L12.9286 7.15339C12.9756 7.42858 13 7.71143 13 8C13 8.28864 12.9755 8.57157 12.9286 8.84682L14.4451 9.93696C14.6537 10.0869 14.7147 10.3705 14.5863 10.5929L13.5387 12.4073C13.4103 12.6297 13.1342 12.7187 12.9001 12.613L11.1971 11.8445C10.7641 12.205 10.2692 12.4937 9.73077 12.6923L9.54503 14.5498C9.51947 14.8054 9.30439 15 9.04751 15H6.9525C6.69562 15 6.48054 14.8054 6.45498 14.5498L6.26924 12.6923C5.73071 12.4936 5.23579 12.2049 4.80275 11.8443L3.09994 12.6128C2.86581 12.7185 2.58969 12.6295 2.46126 12.4071L1.41375 10.5927C1.28531 10.3703 1.34634 10.0867 1.55492 9.93673L3.07138 8.84661C3.02445 8.57142 3 8.28857 3 8C3 7.71136 3.02446 7.42843 3.07142 7.15318L1.55492 6.06304C1.34634 5.9131 1.28531 5.62951 1.41375 5.40705L2.46126 3.59272C2.58969 3.37025 2.8658 3.28131 3.09994 3.38698L4.80293 4.15552C5.23593 3.79505 5.73079 3.50634 6.26924 3.30766L6.45498 1.45025ZM6.27751 9.01699L6.25615 8.98C6.09305 8.69039 6 8.35606 6 8C6 6.89543 6.89543 6 8 6C8.73327 6 9.37437 6.39461 9.72253 6.98306L9.74383 7.01995C9.90695 7.30957 10 7.64392 10 8C10 9.10457 9.10457 10 8 10C7.26676 10 6.62567 9.60541 6.27751 9.01699Z"/>
          </svg>
        </button>
        <button id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-toggle-icon theme-icon-sun"></span>
          <span class="theme-toggle-icon theme-icon-moon"></span>
        </button>
      </div>
    </div>
    <div id="headerMeta">
      <span id="studyName"></span>
      <span id="versionInfo"></span>
    </div>
  </header>

  <section id="sheetPreview">
    <div class="sheet-preview-header">
      <div class="preview-tabs">
        <button class="preview-tab active" data-tab="sheet">Sheet Preview</button>
        <button class="preview-tab hidden" data-tab="intake">Screenspace Intake <span id="intakeTabBadge" class="intake-tab-badge hidden">0</span></button>
      </div>
      <button id="filterToggle" class="btn btn-small btn-icon" title="Filter rows">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M14 2C14 1.44772 13.5523 1 13 1H3C2.44772 1 2 1.44772 2 2V4.17157C2 4.70201 2.21071 5.21071 2.58579 5.58579L5.41421 8.41421C5.78929 8.78929 6 9.29799 6 9.82843V14.191C6 14.5627 6.39116 14.8044 6.72361 14.6382L8.89443 13.5528C9.572 13.214 10 12.5215 10 11.7639V9.82843C10 9.29799 10.2107 8.78929 10.5858 8.41421L13.4142 5.58579C13.7893 5.21071 14 4.70201 14 4.17157V2Z"/>
        </svg>
        Filter
      </button>
      <button id="refreshSheet" class="btn btn-small btn-icon" title="Refresh sheet data from source">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M13.8356 2.47703C14.2498 2.47703 14.5856 2.81282 14.5856 3.22703V6.40901C14.5856 6.82322 14.2498 7.15901 13.8356 7.15901H10.6536C10.2394 7.15901 9.90362 6.82322 9.90362 6.40901C9.90362 5.9948 10.2394 5.65901 10.6536 5.65901H12.0249L11.1839 4.81802C9.42659 3.06066 6.57734 3.06066 4.81999 4.81802C4.53421 5.10379 4.29556 5.41752 4.10337 5.74996C3.89606 6.10855 3.43729 6.23119 3.07869 6.02388C2.7201 5.81656 2.59746 5.3578 2.80477 4.9992C3.06184 4.55455 3.38024 4.13644 3.75933 3.75736C6.10247 1.41421 9.90146 1.41421 12.2446 3.75736L13.0856 4.59835V3.22703C13.0856 2.81282 13.4214 2.47703 13.8356 2.47703ZM12.925 9.97662C13.2836 10.184 13.4062 10.6427 13.1989 11.0013C12.9418 11.4458 12.6235 11.8637 12.2446 12.2426C9.90146 14.5858 6.10247 14.5858 3.75933 12.2426L2.91833 11.4017V12.773C2.91833 13.1872 2.58255 13.523 2.16834 13.523C1.75412 13.523 1.41834 13.1872 1.41834 12.773L1.41833 9.59099C1.41833 9.17678 1.75412 8.84099 2.16833 8.84099H5.35031C5.76453 8.84099 6.10032 9.17678 6.10032 9.59099C6.10032 10.0052 5.76453 10.341 5.35032 10.341H3.97899L4.81999 11.182C6.57734 12.9393 9.42659 12.9393 11.1839 11.182C11.4696 10.8963 11.7082 10.5827 11.9003 10.2504C12.1077 9.89186 12.5665 9.76927 12.925 9.97662Z"/>
        </svg>
        Refresh
      </button>
    </div>
    <div id="filterBar" class="hidden"></div>
    <div id="sheetGrid">
      <div id="sheetLoading">
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row"></div>
        <div class="skeleton skeleton-row" style="width: 60%"></div>
      </div>
    </div>
    <div id="intakePanel" class="hidden">
      <div class="area-controls" id="intakeControls">
        <label class="intake-cluster-label">Cluster <input id="intakeClusterThreshold" type="number" min="1" max="60" value="5" class="intake-cluster-input">s</label>
        <button id="intakeAddAllBtn" class="btn btn-small" disabled>Add All to Artifacts</button>
        <button id="intakeReelAllBtn" class="btn btn-small" disabled>Add All to Reel</button>
      </div>
      <div class="intake-filters">
        <input id="intakeFilterSearch" type="text" placeholder="Search events&#x2026;" class="intake-filter-search" autocomplete="off">
        <div class="intake-filter-pills">
          <button class="intake-filter-det" data-detector="multitool" style="--det-color:#2563eb"><span class="intake-det-icon" data-icon="link"></span>multitool</button>
          <button class="intake-filter-det" data-detector="color" style="--det-color:#8b5cf6"><span class="intake-det-icon" data-icon="eye-dropper"></span>color</button>
          <button class="intake-filter-det" data-detector="change" style="--det-color:#f97316"><span class="intake-det-icon" data-icon="bolt"></span>change</button>
          <button class="intake-filter-det" data-detector="similarity" style="--det-color:#0ea5e9"><span class="intake-det-icon" data-icon="photo"></span>similarity</button>
          <button class="intake-filter-det" data-detector="text" style="--det-color:#10b981"><span class="intake-det-icon" data-icon="language"></span>text</button>
          <button class="intake-filter-det" data-detector="numbers" style="--det-color:#eab308"><span class="intake-det-icon" data-icon="hashtag"></span>numbers</button>
          <button class="intake-filter-det" data-detector="timelapse" style="--det-color:#ec4899"><span class="intake-det-icon" data-icon="film"></span>timelapse</button>
          <button class="intake-filter-det" data-detector="template" style="--det-color:#f43f5e"><span class="intake-det-icon" data-icon="viewfinder-circle"></span>template</button>
          <button class="intake-filter-det" data-detector="flow" style="--det-color:#6366f1"><span class="intake-det-icon" data-icon="arrows-right-left"></span>flow</button>
          <button class="intake-filter-det" data-detector="scene" style="--det-color:#14b8a6"><span class="intake-det-icon" data-icon="squares-2x2"></span>scene</button>
        </div>
        <label class="intake-filter-new-label"><input id="intakeFilterNew" type="checkbox"> New only</label>
      </div>
      <canvas id="intakeTimeline"></canvas>
      <div id="intakeCards" class="intake-cards-grid">
        <div class="drop-target-empty">Screenspace events will appear here</div>
      </div>
    </div>
  </section>

  <div id="panelDivider"><div class="divider-handle"></div></div>

  <div id="bottomPanel">
  <section id="dropAreas">
    <div id="artifactsArea" class="drop-area">
      <h3><svg id="artifactsSpinner" class="title-spinner" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" opacity="0.25"/><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="20 15" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 7 7" to="360 7 7" dur="0.7s" repeatCount="indefinite"/></circle></svg>Artifacts <span id="artifactsCount">(0)</span> <span id="viewerArtifactCount"></span></h3>
      <div class="area-controls">
        <select id="artifactFormat">
          <option value="clip">Clip (.mp4)</option>
          <option value="screen">Screenshot (.png)</option>
          <option value="gif">GIF (.gif)</option>
        </select>
        <label id="titlecardGroup" class="titlecard-group">
          <input id="titlecardEnabled" type="checkbox">
          <span class="titlecard-label-text">Titlecards</span>
          <input id="titlecardDuration" type="number" min="1" step="1" value="2"
                 class="titlecard-duration-input" title="Duration (seconds)">
          <span class="titlecard-label-unit">s</span>
        </label>
        <button id="generateBtn" class="btn btn-primary" disabled data-tooltip="Add cells to the work area first">Generate</button>
        <button id="buildViewerBtn" class="btn btn-primary" disabled data-tooltip="Generate artifacts first">Build Viewer</button>
        <button id="stashArtifactsBtn" class="btn btn-small btn-icon" disabled data-tooltip="Add cells to the work area first">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M3 2C2.44772 2 2 2.44772 2 3V4C2 4.55228 2.44772 5 3 5H13C13.5523 5 14 4.55228 14 4V3C14 2.44772 13.5523 2 13 2H3Z"/>
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3 6H13V12C13 13.1046 12.1046 14 11 14H5C3.89543 14 3 13.1046 3 12V6ZM6 8.75C6 8.33579 6.33579 8 6.75 8H9.25C9.66421 8 10 8.33579 10 8.75C10 9.16421 9.66421 9.5 9.25 9.5H6.75C6.33579 9.5 6 9.16421 6 8.75Z"/>
          </svg>
          Stash
        </button>
        <button id="clearArtifactsBtn" class="btn btn-small btn-icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.28033 4.21967C4.98744 3.92678 4.51256 3.92678 4.21967 4.21967C3.92678 4.51256 3.92678 4.98744 4.21967 5.28033L6.93934 8L4.21967 10.7197C3.92678 11.0126 3.92678 11.4874 4.21967 11.7803C4.51256 12.0732 4.98744 12.0732 5.28033 11.7803L8 9.06066L10.7197 11.7803C11.0126 12.0732 11.4874 12.0732 11.7803 11.7803C12.0732 11.4874 12.0732 11.0126 11.7803 10.7197L9.06066 8L11.7803 5.28033C12.0732 4.98744 12.0732 4.51256 11.7803 4.21967C11.4874 3.92678 11.0126 3.92678 10.7197 4.21967L8 6.93934L5.28033 4.21967Z"/>
          </svg>
          Clear
        </button>
      </div>
      <div id="artifactsList" class="drop-target">
        <div class="drop-target-empty">Click or drag cells here to queue for generation</div>
      </div>
      <button id="addToReelBtn" class="btn btn-small btn-icon" disabled data-tooltip="Add cells to the work area first">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M8 2a.75.75 0 0 1 .75.75v8.69l3.22-3.22a.75.75 0 1 1 1.06 1.06l-4.5 4.5a.75.75 0 0 1-1.06 0l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.22 3.22V2.75A.75.75 0 0 1 8 2Z"/>
        </svg>
        Add to Reel
      </button>
    </div>
  </section>

  <section id="stashedArtifactsArea" class="hidden">
    <div id="stashedArtifactsHeader">
      <h3>Stashed Artifacts <span id="stashedArtifactsCount">(0)</span></h3>
    </div>
    <div id="stashedArtifactsList"></div>
  </section>

  <section id="reelArea">
    <div id="reelHeader">
      <h3><svg id="reelSpinner" class="title-spinner" width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" opacity="0.25"/><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5" stroke-dasharray="20 15" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 7 7" to="360 7 7" dur="0.7s" repeatCount="indefinite"/></circle></svg>Reel <span id="reelCount">(0)</span> <span id="reelDuration"></span></h3>
      <div class="area-controls">
        <div class="highlights-group">
          <button id="buildHighlightsBtn" class="btn btn-primary btn-icon"
                  title="Auto-select the best clips scored by severity, uniqueness, and keyword annotations.">
            <svg class="sparkles-icon" width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M5 4C5.36246 4 5.67306 4.25922 5.7379 4.61584L5.99021 6.00355C6.08335 6.51578 6.48422 6.91665 6.99645 7.00979L8.38416 7.2621C8.74078 7.32694 9 7.63754 9 8C9 8.36246 8.74078 8.67306 8.38416 8.7379L6.99645 8.99021C6.48422 9.08335 6.08335 9.48422 5.99021 9.99645L5.7379 11.3842C5.67306 11.7408 5.36246 12 5 12C4.63754 12 4.32694 11.7408 4.2621 11.3842L4.00979 9.99645C3.91665 9.48422 3.51578 9.08335 3.00355 8.99021L1.61584 8.7379C1.25922 8.67306 1 8.36246 1 8C1 7.63754 1.25922 7.32694 1.61584 7.2621L3.00355 7.00979C3.51578 6.91665 3.91665 6.51578 4.00979 6.00355L4.2621 4.61584C4.32694 4.25922 4.63754 4 5 4Z"/>

          <div id="highlightsDurationDrawer" class="highlights-drawer">
            <label class="highlights-drawer-label">Duration (s)
              <input id="highlightsDuration" type="number" min="10" step="10" value="180" class="highlights-drawer-input">

          </div>

      </div>
    </div>
    <div id="reelList" class="drop-target">
      <div class="drop-target-empty">Shift+click or drag cells here to build a reel</div>
    </div>
  </section>

  <section id="stashedReelsArea" class="hidden">
    <div id="stashedReelsHeader">
      <h3>Stashed Reels <span id="stashedReelsCount">(0)</span></h3>
    </div>
    <div id="stashedReelsList"></div>
  </section>

  </div>

  <div id="settingsOverlay" class="hidden">
    <div class="settings-panel">
      <div class="settings-header">
        <h3>Settings</h3>
        <button id="settingsClose" class="btn btn-small">Close</button>
      </div>
      <div id="settingsContent"></div>
      <div class="settings-footer">
        <button id="settingsResetBtn" class="btn btn-small">Reset to Defaults</button>
        <span id="settingsSaveStatus" class="settings-save-status"></span>
      </div>
    </div>
  </div>

  <div id="logOverlay" class="hidden">
    <div class="log-panel">
      <div class="log-header">
        <h3>Artifact Log</h3>
        <button id="logClose" class="btn btn-small">Close</button>
      </div>
      <div id="logContent"></div>
      <div class="log-footer">
        <span id="logCount"></span>
      </div>
    </div>
  </div>

  <div id="statusOverlay" class="hidden">
    <div class="status-card">
      <div id="statusSpinner" class="spinner"></div>
      <h3 id="statusTitle">Processing...</h3>
      <p id="statusMessage"></p>
      <div class="status-actions">
        <button id="statusDismiss" class="btn btn-small hidden">Dismiss</button>
        <button id="statusOpen" class="btn btn-small btn-primary hidden">Open</button>
      </div>
    </div>
  </div>

  <div id="confirmOverlay" class="hidden">
    <div class="confirm-card">
      <h3 id="confirmTitle"></h3>
      <p id="confirmMessage"></p>
      <div class="confirm-actions">
        <button id="confirmNo" class="btn btn-small">Sheet Only</button>
        <button id="confirmYes" class="btn btn-small btn-primary">Include Intake</button>
      </div>
    </div>
  </div>

  <script src="studio.js"></script>
</body>
</html>
