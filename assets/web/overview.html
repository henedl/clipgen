<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Overview</title>
  <!-- CLIPGEN_HEAD_HERE -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="topnav.css">
  <link rel="stylesheet" href="primitives.css">
  <link rel="stylesheet" href="overview.css">
  <link rel="stylesheet" href="overview-convergence.css">
  <link rel="stylesheet" href="overview-metadata.css">
  <link rel="stylesheet" href="overview-reports.css">
  <link rel="stylesheet" href="settings-modal.css">
  <link rel="stylesheet" href="hotkeys.css">
  <link rel="stylesheet" href="command-palette.css">
  <link rel="stylesheet" href="color-picker.css">
  <link rel="stylesheet" href="start-overlay.css">
</head>
<body data-frontend="overview">
  <!-- Shared chrome: TopNav + start overlay -->
  <topnav-mount data-frontend="overview"></topnav-mount>
  <start-overlay-mount></start-overlay-mount>

  <!-- Subheader: study meta + the cohort-level tabs. Same shared .subheader
       chrome strip Studio/Transcripts/Screenspace use (tokens.css). -->
  <header id="ovSubheader" class="subheader">
    <div class="subheader-left">
      <span id="ovStudyName" class="ov-study-name"></span>
      <span id="ovStudyMeta"></span>
    </div>
    <nav class="subheader-tabs" role="tablist" aria-label="Overview tabs">
      <button class="preview-tab active" type="button" role="tab" data-tab="metadata" data-hotkey="overview.tabMetadata">Metadata</button>
      <button class="preview-tab" type="button" role="tab" data-tab="convergence" data-hotkey="overview.tabConvergence">Convergence</button>
      <button class="preview-tab" type="button" role="tab" data-tab="reports" data-hotkey="overview.tabReports">Reports
        <span class="cg-wip-badge" data-tooltip="The mini-report is a work in progress">WIP</span>
      </button>
    </nav>
    <div class="subheader-actions">
      <button id="ovRefresh" class="cg-btn cg-btn-bare cg-btn-sm" type="button" data-hotkey="global.refresh"
              title="Re-fetch sheet, Screenspace, and transcript data"><span class="cg-btn-icon" data-icon="arrow-path"></span><span>Refresh</span></button>
      <!-- Keyboard shortcuts: opens the shared hotkeys.js cheatsheet. -->
      <button id="ovShortcutsBtn" type="button" class="btn btn-small hk-help-btn"
              data-hotkeys-help data-hotkey="global.cheatsheet"
              aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)">
        <span class="hk-help-icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <!-- Convergence tab (overview-convergence.js renders into these) -->
  <div id="convergencePanel" class="hidden">
    <div id="convergenceControls" class="area-controls"></div>
    <div id="convergenceFilters" class="convergence-filters"></div>
    <div id="convergenceTimeline" class="convergence-timeline-container"></div>
  </div>

  <!-- Metadata tab (overview-metadata.js renders into it wholesale; the
       default tab, so it starts visible) -->
  <div id="metadataPanel"></div>

  <!-- Reports tab (overview-reports.js renders into it wholesale) -->
  <div id="reportsPanel" class="hidden"></div>

  <div id="toast" class="toast hidden"></div>

  <!-- Deps order is a contract: utils → primitives → chrome → settings →
       intake-cluster (hub clustering) → overview hub → satellites. -->
  <script src="utils.js" defer></script>
  <script src="hotkeys.js" defer></script>
  <script src="motion.js" defer></script>
  <script src="primitives.js" defer></script>
  <script src="topnav.js" defer></script>
  <script src="start-overlay.js" defer></script>
  <script src="dev-token-tweak.js" defer data-dev-only></script>
  <script src="color-picker.js" defer></script>
  <script src="settings-modal.js" defer></script>
  <script src="command-palette.js" defer></script>
  <script src="intake-cluster.js" defer></script>
  <script src="overview.js" defer></script>
  <script src="overview-convergence.js" defer></script>
  <script src="overview-metadata.js" defer></script>
  <script src="overview-reports.js" defer></script>
</body>
</html>
