          <span class="theme-toggle-icon theme-icon-sun"></span>

      </div>
    </div>
    <div id="headerMeta">
      <span id="studyName"></span>
      <span id="generatedAt"></span>
    </div>
  </header>

  <section id="playerPane">
    <div id="playerEmpty">
      <div id="playerPlaceholder">
        <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="8" width="40" height="32" rx="4"/>
          <polygon points="20,16 34,24 20,32"/>
        </svg>
        <p>Select an artifact from the timelines</p>
      </div>
    </div>
    <div id="playerContent" class="hidden">
      <div id="playerPreview"></div>
      <div id="playerInfo">
        <div id="playerBadges" class="detail-badges">
          <span id="playerSeverityPill" class="detail-badge detail-severity hidden"></span>
          <span id="playerType" class="detail-badge"></span>
        </div>
        <h2 id="playerDescription"></h2>
        <div id="playerMeta"></div>
      </div>
    </div>
  </section>

  <section id="participantTimelines">
    <div id="timelinesHeader">
      <h3>Participant Timelines</h3>
      <div class="timelines-legend-group">
        <div id="timelineLegend">
          <span class="legend-item"><span class="legend-swatch clip"></span> Clip</span>
          <span class="legend-item"><span class="legend-swatch screen"></span> Screenshot</span>
          <span class="legend-item"><span class="legend-swatch gif"></span> GIF</span>
        </div>
        <div id="severityLegend" class="hidden" aria-label="Severity colors"></div>
      </div>
    </div>
    <div id="participantRows"></div>
    <div id="participantTicks"></div>
    <div class="timeline-track-wrap screenspace-track-wrap hidden" id="screenspaceTrackWrap">
      <div id="screenspaceTrack"></div>
    </div>
    <div id="screenspaceLegend" class="hidden" aria-label="Screenspace detector types"></div>
  </section>

  <div id="tooltip" class="hidden"></div>

  <div id="emptyState" class="hidden">
    <p>No artifacts were generated for this run.</p>
  </div>

  <script src="viewer.js" defer></script>

</html>
