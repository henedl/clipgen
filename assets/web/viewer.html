<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Timeline Viewer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%230a0a0a' stroke-width='11' stroke-linecap='square' stroke-linejoin='miter'><path d='M 18 18 L 82 18 L 82 82'/><path d='M 18 40 L 60 40 L 60 82'/><path d='M 18 62 L 38 62 L 38 82'/></svg>">
  <link rel="stylesheet" href="tokens.css" data-dev-only>
  <link rel="stylesheet" href="viewer.css">
  <link rel="stylesheet" href="card-scrubber.css">
</head>
<body>
  <!-- Timeline viewer shell; JSON injected before scripts. -->
  <header id="pageHeader">
    <div id="pageHeaderTop">
      <h1><span class="brand-mark" aria-hidden="true"></span>clipgen <span class="header-light">Timeline Viewer</span></h1>
      <div class="header-buttons">
        <button id="screenspaceToggle" type="button" aria-label="Toggle screenspace events" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 2C2.67157 2 2 2.67157 2 3.5V5.5C2 6.32843 2.67157 7 3.5 7H5.5C6.32843 7 7 6.32843 7 5.5V3.5C7 2.67157 6.32843 2 5.5 2H3.5Z"/><path d="M3.5 9C2.67157 9 2 9.67157 2 10.5V12.5C2 13.3284 2.67157 14 3.5 14H5.5C6.32843 14 7 13.3284 7 12.5V10.5C7 9.67157 6.32843 9 5.5 9H3.5Z"/><path d="M9 3.5C9 2.67157 9.67157 2 10.5 2H12.5C13.3284 2 14 2.67157 14 3.5V5.5C14 6.32843 13.3284 7 12.5 7H10.5C9.67157 7 9 6.32843 9 5.5V3.5Z"/><path d="M10.5 9C9.67157 9 9 9.67157 9 10.5V12.5C9 13.3284 9.67157 14 10.5 14H12.5C13.3284 14 14 13.3284 14 12.5V10.5C14 9.67157 13.3284 9 12.5 9H10.5Z"/></svg>
        </button>
        <button id="filmstripToggle" type="button" aria-label="Toggle filmstrip thumbnails" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M1 3.5C1 2.67157 1.67157 2 2.5 2H13.5C14.3284 2 15 2.67157 15 3.5V12.5C15 13.3284 14.3284 14 13.5 14H2.5C1.67157 14 1 13.3284 1 12.5V3.5ZM2.5 3.75C2.5 3.61193 2.61193 3.5 2.75 3.5H4.25C4.38807 3.5 4.5 3.61193 4.5 3.75V4.75C4.5 4.88807 4.38807 5 4.25 5H2.75C2.61193 5 2.5 4.88807 2.5 4.75V3.75ZM6.25 3.5C6.11193 3.5 6 3.61193 6 3.75V7.25C6 7.38807 6.11193 7.5 6.25 7.5H9.75C9.88807 7.5 10 7.38807 10 7.25V3.75C10 3.61193 9.88807 3.5 9.75 3.5H6.25ZM6 8.75C6 8.61193 6.11193 8.5 6.25 8.5H9.75C9.88807 8.5 10 8.61193 10 8.75V12.25C10 12.3881 9.88807 12.5 9.75 12.5H6.25C6.11193 12.5 6 12.3881 6 12.25V8.75ZM11.75 3.5C11.6119 3.5 11.5 3.61193 11.5 3.75V4.75C11.5 4.88807 11.6119 5 11.75 5H13.25C13.3881 5 13.5 4.88807 13.5 4.75V3.75C13.5 3.61193 13.3881 3.5 13.25 3.5H11.75ZM2.5 11.25C2.5 11.1119 2.61193 11 2.75 11H4.25C4.38807 11 4.5 11.1119 4.5 11.25V12.25C4.5 12.3881 4.38807 12.5 4.25 12.5H2.75C2.61193 12.5 2.5 12.3881 2.5 12.25V11.25ZM11.75 11C11.6119 11 11.5 11.1119 11.5 11.25V12.25C11.5 12.3881 11.6119 12.5 11.75 12.5H13.25C13.3881 12.5 13.5 12.3881 13.5 12.25V11.25C13.5 11.1119 13.3881 11 13.25 11H11.75ZM2.5 8.75C2.5 8.61193 2.61193 8.5 2.75 8.5H4.25C4.38807 8.5 4.5 8.61193 4.5 8.75V9.75C4.5 9.88807 4.38807 10 4.25 10H2.75C2.61193 10 2.5 9.88807 2.5 9.75V8.75ZM11.75 8.5C11.6119 8.5 11.5 8.61193 11.5 8.75V9.75C11.5 9.88807 11.6119 10 11.75 10H13.25C13.3881 10 13.5 9.88807 13.5 9.75V8.75C13.5 8.61193 13.3881 8.5 13.25 8.5H11.75ZM2.5 6.25C2.5 6.11193 2.61193 6 2.75 6H4.25C4.38807 6 4.5 6.11193 4.5 6.25V7.25C4.5 7.38807 4.38807 7.5 4.25 7.5H2.75C2.61193 7.5 2.5 7.38807 2.5 7.25V6.25ZM11.75 6C11.6119 6 11.5 6.11193 11.5 6.25V7.25C11.5 7.38807 11.6119 7.5 11.75 7.5H13.25C13.3881 7.5 13.5 7.38807 13.5 7.25V6.25C13.5 6.11193 13.3881 6 13.25 6H11.75Z" fill="currentColor"/></svg>
        </button>
        <button id="scrubAudioToggle" type="button" aria-label="Toggle hover audio scrubbing" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="6" width="1.6" height="4" rx="0.8"/><rect x="5" y="3.5" width="1.6" height="9" rx="0.8"/><rect x="8" y="5" width="1.6" height="6" rx="0.8"/><rect x="11" y="2.5" width="1.6" height="11" rx="0.8"/></svg>
        </button>
        <button id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-toggle-icon theme-icon-sun"></span>
          <span class="theme-toggle-icon theme-icon-moon"></span>
        </button>
      </div>
    </div>
    <div id="headerMeta">
      <span id="studyName"></span>
      <span id="generatedAt"></span>
    </div>
  </header>

  <section id="timelinePane">
  <!-- Primary timeline + optional screenspace track -->

    <div class="timeline-track-wrap">
      <div id="timelineTrack"></div>
      <button class="track-expand-btn" type="button" aria-label="Expand tracks" aria-expanded="false" title="Expand tracks">
        <span class="track-expand-icon"></span>
      </button>
    </div>
    <div class="timeline-track-wrap screenspace-track-wrap hidden" id="screenspaceTrackWrap">
      <div id="screenspaceTrack"></div>
    </div>
    <div id="timelineTicks"></div>
    <div id="timelineLegend">
      <span class="legend-item"><span class="legend-swatch clip"></span> Clip</span>
      <span class="legend-item"><span class="legend-swatch screen"></span> Screenshot</span>
      <span class="legend-item"><span class="legend-swatch gif"></span> GIF</span>
    </div>
    <div id="screenspaceLegend" class="hidden" aria-label="Screenspace detector types"></div>
    <div id="severityLegend" class="hidden" aria-label="Severity colors"></div>
  </section>

  <section id="attachmentsPane" class="hidden" aria-label="Attachments">
  <!-- Single-file outputs that aren't timeline events (timelapse, heatmap) -->
    <h3>Attachments</h3>
    <div id="attachmentsGrid"></div>
  </section>

  <div id="layout">
  <!-- Sidebar filters + list, artifact detail pane -->

    <aside id="sidebar">
      <div id="filters">
        <h3>Filters</h3>
        <label for="filterCategory">Category</label>
        <select id="filterCategory"><option value="">All categories</option></select>
        <label for="filterParticipant">Participant</label>
        <select id="filterParticipant"><option value="">All participants</option></select>
        <div id="filterSeverityWrap" class="filter-severity-wrap hidden">
          <label for="filterSeverity">Severity</label>
          <select id="filterSeverity"><option value="">All severities</option></select>
        </div>
        <fieldset id="filterType">
          <legend>Type</legend>
          <label><input type="checkbox" value="clip" checked> Clip</label>
          <label><input type="checkbox" value="screen" checked> Screenshot</label>
          <label><input type="checkbox" value="gif" checked> GIF</label>
        </fieldset>
      </div>
      <div id="artifactListHeader" class="artifact-list-header">
        <h3>Artifacts <span id="artifactCount"></span></h3>
        <div id="artifactSortBar" class="artifact-sort-bar" role="toolbar" aria-label="Sort artifact list">
          <button type="button" class="artifact-sort-btn" data-sort="severity" aria-pressed="false">
            !<span class="sort-dir" aria-hidden="true"></span>
          </button>
          <button type="button" class="artifact-sort-btn" data-sort="chrono" aria-pressed="false">
            ⏱<span class="sort-dir" aria-hidden="true"></span>
          </button>
          <button type="button" class="artifact-sort-btn" data-sort="duration" aria-pressed="false">
            ↔<span class="sort-dir" aria-hidden="true"></span>
          </button>
          <button type="button" class="artifact-sort-btn" data-sort="alpha" aria-pressed="false">
            A<span class="sort-dir" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div id="artifactList"></div>
    </aside>

    <section id="detailPane">
      <div id="detailEmpty">
        <p>Select an artifact from the timeline or the list to view details.</p>
      </div>
      <div id="detailContent" class="hidden">
        <div id="detailHeader">
          <div id="detailBadges" class="detail-badges">
            <span id="detailSeverityPill" class="detail-badge detail-severity hidden"></span>
            <span id="detailType" class="detail-badge"></span>
          </div>
          <h2 id="detailDescription"></h2>
        </div>
        <div id="detailMeta">
          <dl>
            <dt>Category</dt><dd id="detailCategory"></dd>
            <dt>Participant</dt><dd id="detailParticipant"></dd>
            <dt>Time</dt><dd id="detailTime"></dd>
            <dt>Cell</dt><dd id="detailCell"></dd>
            <dt>Source</dt><dd id="detailSource"></dd>
            <dt>File</dt><dd id="detailFile"></dd>
            <div id="detailIntakeRow" class="hidden"><dt id="detailIntakeDt">Screenspace</dt><dd id="detailIntakeLabel"></dd></div>
            <div id="detailTranscriptRow" class="hidden"><dt>Transcript</dt><dd id="detailTranscript"></dd></div>
          </dl>
        </div>
        <div id="detailPreview"></div>
      </div>
    </section>
  </div>

  <!-- Tooltip + empty state sit outside #layout -->
  <div id="tooltip" class="hidden"></div>

  <div id="emptyState" class="hidden">
    <p>No artifacts were generated for this run.</p>
  </div>

  <!-- CLIPGEN_DATA_HERE -->
  <!-- viewer.js expects utils.js first; card-scrubber before viewer.js -->
  <script src="utils.js" defer></script>
  <script src="card-scrubber.js" defer></script>
  <script src="viewer.js" defer></script>
</body>
</html>
