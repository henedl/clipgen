<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Workflows</title>
  <!-- CLIPGEN_HEAD_HERE -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="topnav.css">
  <link rel="stylesheet" href="workflows.css">
  <link rel="stylesheet" href="settings-modal.css">
  <link rel="stylesheet" href="color-picker.css">
  <link rel="stylesheet" href="start-overlay.css">
</head>
<body data-frontend="workflows">
  <!-- Shared chrome: TopNav + start overlay -->
  <topnav-mount data-frontend="workflows"></topnav-mount>
  <start-overlay-mount></start-overlay-mount>

  <!-- Three-pane scaffold: node palette · canvas · run/results panel.
       M1 ships the catalog-driven palette, the pan/zoom canvas, and the
       blueprint switcher; M2 adds typed-port wires + param editors; M4 adds the
       Run button + the live run/results panel (workflows-runs.js). See
       plans/WORKFLOWS-PLAN.md. -->
  <main id="wfShell">
    <aside id="wfSidebar" aria-label="Node palette">
      <div class="wf-sidebar-header">Nodes</div>
      <input id="wfPaletteSearch" class="wf-palette-search" type="text"
             autocomplete="off" placeholder="Search nodes…"
             aria-label="Search nodes" />
      <div id="wfPalette" class="wf-palette"></div>
      <!-- Stashes (M5): built-in recipes + saved sub-graphs. Drag or click an
           item to stamp it onto the canvas (the stashes satellite remaps ids). -->
      <div class="wf-sidebar-header">Stashes</div>
      <div id="wfStashList" class="wf-stash-list"></div>
    </aside>

    <section id="wfCanvasWrap" aria-label="Workflow canvas">
      <header id="wfToolbar">
        <label class="wf-toolbar-label" for="wfBlueprintSelect">Blueprint</label>
        <select id="wfBlueprintSelect" aria-label="Active blueprint" disabled></select>
        <input id="wfBlueprintName" type="text" autocomplete="off"
               aria-label="Blueprint name" placeholder="Untitled" disabled />
        <button id="wfNewBlueprint" class="btn btn-small" type="button" disabled>New</button>
        <button id="wfDeleteBlueprint" class="btn btn-small" type="button" disabled>Delete</button>
        <button id="wfExportBlueprint" class="btn btn-small" type="button" disabled
                title="Download this blueprint as JSON">Export</button>
        <button id="wfImportBlueprint" class="btn btn-small" type="button" disabled
                title="Import a blueprint from a JSON file">Import</button>
        <input id="wfImportFile" type="file" accept="application/json,.json" hidden />
        <button id="wfCleanUp" class="btn btn-small" type="button" disabled
                title="Auto-arrange the nodes">Clean up</button>
        <button id="wfSaveStash" class="btn btn-small" type="button" disabled
                title="Save the selected nodes as a reusable stash">Stash selection</button>
        <button id="wfRunBtn" class="btn btn-small btn-primary" type="button" disabled
                title="Run this workflow (set a Video Source to “All participants” to fan out)">Run</button>
        <button id="wfRunToBtn" class="btn btn-small" type="button" disabled
                title="Run only the selected node and the nodes it depends on">Run to here</button>
        <button id="wfStopBtn" class="btn btn-small hidden" type="button"
                title="Cancel the running workflow">Stop</button>
        <button id="wfTriggerBtn" class="btn btn-small" type="button" disabled
                aria-pressed="false"
                title="Auto-run this blueprint when a new video lands in the input folder">
          <span class="wf-trigger-icon" aria-hidden="true"></span>
          <span class="wf-trigger-label">Auto-run on new video</span>
        </button>
      </header>
      <div id="wfCanvas" class="wf-canvas">
        <!-- Wire layer lives INSIDE #wfWorld so it shares the cards' (transformed)
             stacking context: this lets wires sit above the card frames (z-index 1)
             yet below the port dots (z-index 2) — the card-frame → wire → dot
             sandwich. Paths carry pointer-events; the SVG itself doesn't, so empty
             areas still pan the canvas. renderAllNodes() preserves this <svg>. -->
        <div id="wfWorld" class="wf-world">
          <svg id="wfWires" class="wf-wires"></svg>
        </div>
        <!-- Floating delete control: shown at a wire's midpoint on hover / when a
             wire is selected (screen-positioned, so it stays crisp under zoom). -->
        <button id="wfWireDelete" class="wf-wire-delete-btn hidden" type="button"
                aria-label="Delete wire">
          <span class="wf-wire-delete-icon"></span>
        </button>
        <div id="wfCanvasEmpty" class="wf-canvas-empty">
          <h1>Workflows</h1>
          <p>Drag nodes from the palette to chain clip, Screenspace, and transcript actions.</p>
          <p class="wf-empty-sub">Drag to select, middle-drag to pan, scroll to zoom.</p>
        </div>
        <!-- Gate: covers the canvas (and disables the toolbar) until a blueprint
             is active, so edits can't be dropped into a void before load — and a
             load failure shows a persistent, retryable error rather than a canvas
             that looks editable but never saves. -->
        <div id="wfCanvasOverlay" class="wf-canvas-overlay">
          <p id="wfOverlayMsg" class="wf-overlay-msg">Loading workflows…</p>
          <button id="wfOverlayRetry" class="btn btn-small hidden" type="button">Retry</button>
        </div>
      </div>
    </section>

    <aside id="wfRunPanel" aria-label="Run and results">
      <!-- Pre-run validation (P5): aggregates errors/warnings; errors disable Run.
           Hidden when the graph is clean. Each row links to its node. -->
      <div id="wfValidation" class="wf-validation hidden"></div>
      <div class="wf-sidebar-header">Runs</div>
      <div id="wfRuns" class="wf-runs">
        <p class="wf-empty-hint">Press Run to execute this workflow. Per-node progress
          and results appear here.</p>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- Deps order: utils → chrome → settings → page hub → workflows-*.js satellites.
       Satellites load after the hub; -nodes before -canvas (the canvas reaches
       the nodes renderer via WF.* late-binding either way). -->
  <script src="utils.js"></script>
  <script src="export-actions.js"></script>
  <script src="topnav.js"></script>
  <script src="start-overlay.js"></script>
  <script src="dev-token-tweak.js" data-dev-only></script>
  <script src="color-picker.js"></script>
  <script src="settings-modal.js"></script>
  <script src="workflows.js"></script>
  <script src="workflows-nodes.js"></script>
  <script src="workflows-canvas.js"></script>
  <script src="workflows-wires.js"></script>
  <script src="workflows-runs.js"></script>
  <script src="workflows-stashes.js"></script>
  <script src="workflows-validate.js"></script>
</body>
</html>
