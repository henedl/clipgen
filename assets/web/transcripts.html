<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Transcripts</title>
  <link rel="icon" type="image/svg+xml" href="logos/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="logos/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="logos/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logos/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="logos/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="logos/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="120x120" href="logos/apple-touch-icon-120.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="topnav.css">
  <link rel="stylesheet" href="transcripts.css">
  <link rel="stylesheet" href="settings-modal.css">
</head>
<body data-frontend="transcripts">
  <topnav-mount data-frontend="transcripts"></topnav-mount>

  <header id="trHeader">
    <div id="trSubheader">
      <div class="subheader-left">
        <div id="headerSearch">
          <input id="searchInput" type="text" placeholder="Search across all transcripts..." autocomplete="off">
          <span id="searchCount" class="search-count"></span>
          <div id="searchResults" class="hidden"></div>
        </div>
      </div>
      <div class="subheader-actions">
        <span id="trStatusIndicator" class="status-indicator" tabindex="0" role="status" aria-label="Transcription status"></span>
        <span id="trStatusSr" class="sr-only" aria-live="polite"></span>
        <button id="correctionsBtn" type="button" class="btn btn-small">Corrections</button>
      </div>
    </div>
    <div id="trPillBar">
      <div id="participantPills" class="pill-row" role="tablist" aria-label="Participants">
        <span class="pill-row-empty">No participants</span>
      </div>
    </div>
  </header>

  <main id="trMain">
    <section id="videoSection">
      <div id="videoFrame">
        <video id="videoPlayer" preload="metadata" playsinline>
          <track id="subtitleTrack" kind="subtitles" label="Transcript">
        </video>
        <div id="videoEmpty" class="video-empty">
          <p>Select a participant to view their source video</p>
        </div>
      </div>
      <div id="videoControls">
        <button id="videoPlayBtn" class="player-btn" title="Play/Pause (Space)" aria-label="Play/Pause">
          <span class="player-btn-icon player-icon-play"></span>
        </button>
        <button id="videoMuteBtn" class="player-btn" title="Toggle mute" aria-label="Toggle mute">
          <span class="player-btn-icon player-icon-mute"></span>
        </button>
        <button id="videoSpeedBtn" class="player-btn player-speed-btn" title="Playback speed" aria-label="Playback speed">1x</button>
        <button id="videoCcBtn" class="player-btn" title="Toggle captions" aria-label="Toggle captions" aria-pressed="false">
          <span class="player-btn-icon player-icon-cc"></span>
        </button>
        <button id="videoPipBtn" class="player-btn" title="Toggle picture-in-picture" aria-label="Toggle picture-in-picture" aria-pressed="true">
          <span class="player-btn-icon player-icon-pip"></span>
        </button>
        <button id="videoCollapseBtn" class="player-btn" title="Hide video" aria-label="Hide video" aria-expanded="true">
          <span class="player-btn-icon player-icon-collapse"></span>
        </button>
        <span id="videoTime" class="player-time">0:00 / 0:00</span>
      </div>
      <div id="timelineRow">
        <div id="timelineCanvasWrapper">
          <canvas id="timelineCanvas"></canvas>
          <canvas id="playheadCanvas"></canvas>
        </div>
      </div>
    </section>

    <section id="summarySection" class="hidden">
      <div id="summaryHeader">
        <span class="summary-icon"></span>
        <span class="summary-title">Summary</span>
        <div id="summaryActions" class="summary-actions hidden">
          <button id="summaryRegenerate" type="button" class="summary-action-btn" title="Regenerate summary" aria-label="Regenerate summary">
            <span class="summary-action-icon summary-action-regenerate"></span>
          </button>
          <button id="citationsRegenerate" type="button" class="summary-action-btn" title="Regenerate citations" aria-label="Regenerate citations">
            <span class="summary-action-icon summary-action-citations"></span>
          </button>
          <button id="summaryCopy" type="button" class="summary-action-btn" title="Copy summary" aria-label="Copy summary">
            <span class="summary-action-icon summary-action-copy"></span>
          </button>
          <button id="summaryEdit" type="button" class="summary-action-btn" title="Edit summary" aria-label="Edit summary">
            <span class="summary-action-icon summary-action-edit"></span>
          </button>
        </div>
        <button id="summaryToggle" type="button" class="summary-toggle-btn" aria-label="Toggle summary" aria-expanded="true">
          <span class="summary-chevron"></span>
        </button>
      </div>
      <div id="summaryBody">
        <div id="summaryContent"></div>
      </div>
    </section>

    <section id="transcriptSection">
      <div id="segmentList"></div>
      <div id="transcriptEmpty" class="transcript-empty">
        <p>No transcript available</p>
        <p class="empty-hint">Use the Queue panel to transcribe this participant's video</p>
      </div>
    </section>
  </main>

  <!-- Corrections modal -->
  <div id="correctionsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Corrections Dictionary</h3>
        <button id="closeCorrectionsBtn" class="btn btn-small">Close</button>
      </div>
      <div id="addCorrectionForm" class="correction-form">
        <input id="correctionFrom" type="text" placeholder="Original text" autocomplete="off">
        <span class="correction-arrow">&rarr;</span>
        <input id="correctionTo" type="text" placeholder="Corrected text" autocomplete="off">
        <button id="addCorrectionBtn" class="btn btn-small">Add</button>
      </div>
      <div id="correctionsList"></div>
    </div>
  </div>

  <!-- Mark popover (shared, repositioned per use) -->
  <div id="markPopover" class="mark-popover hidden">
    <div class="mark-popover-categories"></div>
    <input class="mark-popover-label" type="text" placeholder="Label (optional)" autocomplete="off">
    <button class="mark-popover-remove btn btn-small">Remove</button>
  </div>

  <div id="trTooltip" class="tr-tooltip hidden"></div>

  <div id="toast" class="toast hidden"></div>

  <script src="utils.js"></script>
  <script src="topnav.js"></script>
  <script src="dev-token-tweak.js" data-dev-only></script>
  <script src="settings-modal.js"></script>
  <script src="transcripts.js"></script>
</body>
</html>
