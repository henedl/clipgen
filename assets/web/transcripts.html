<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>clipgen Transcripts</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="transcripts.css">
  <link rel="stylesheet" href="settings-modal.css">
</head>
<body>
  <header id="trHeader">
    <div id="headerTop">
      <h1>clipgen <span class="frontend-switcher" data-current="transcripts"><span class="frontend-switcher-trigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false"><span class="header-light">Transcripts</span><span class="frontend-switcher-chevron" aria-hidden="true"></span></span><span class="frontend-switcher-panel" role="menu" aria-hidden="true"><a class="frontend-switcher-item" href="/studio/" data-frontend="studio" role="menuitem">Studio</a><a class="frontend-switcher-item" href="/insights/" data-frontend="insights" role="menuitem">Insights</a><a class="frontend-switcher-item" href="/screenspace/" data-frontend="screenspace" role="menuitem">Screenspace</a></span></span></h1>
      <div id="headerActions">
        <span id="trStatusIndicator" class="status-indicator" tabindex="0" role="status" aria-label="Transcription status"></span>
        <span id="trStatusSr" class="sr-only" aria-live="polite"></span>
        <button id="correctionsBtn" type="button" class="btn btn-small">Corrections</button>
        <button id="settingsBtn" type="button" class="btn btn-small btn-icon" title="Settings" aria-label="Settings">
          <span class="settings-trigger-icon"></span>
        </button>
        <button id="tooltipToggle" type="button" aria-label="Toggle cross-reference tooltips" aria-pressed="true" title="Toggle cross-reference tooltips">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M1 8.74053C1 9.72321 1.71341 10.5653 2.68906 10.6827C3.5937 10.7915 4.50678 10.8729 5.42746 10.926C5.78969 10.9469 6.11506 11.1572 6.27733 11.4817L7.32918 13.5854C7.45622 13.8395 7.71592 14 8 14C8.28408 14 8.54378 13.8395 8.67082 13.5854L9.72265 11.4817C9.88492 11.1572 10.2103 10.9469 10.5725 10.9261C11.4932 10.873 12.4063 10.7916 13.3109 10.6828C14.2866 10.5654 15 9.72332 15 8.74062V4.25938C15 3.27668 14.2866 2.43458 13.3109 2.3172C11.57 2.10777 9.79777 2 8.00039 2C6.20273 2 4.43025 2.10781 2.68906 2.3173C1.71341 2.43469 1 3.27679 1 4.25947V8.74053ZM4 5.25C4 4.83579 4.33579 4.5 4.75 4.5H11.25C11.6642 4.5 12 4.83579 12 5.25C12 5.66421 11.6642 6 11.25 6H4.75C4.33579 6 4 5.66421 4 5.25ZM4.75 7C4.33579 7 4 7.33579 4 7.75C4 8.16421 4.33579 8.5 4.75 8.5H7.25C7.66421 8.5 8 8.16421 8 7.75C8 7.33579 7.66421 7 7.25 7H4.75Z"/>
          </svg>
        </button>
        <button id="themeToggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
          <span class="theme-toggle-icon theme-icon-sun"></span>
          <span class="theme-toggle-icon theme-icon-moon"></span>
        </button>
      </div>
    </div>
    <div id="participantPills" class="pill-row" role="tablist" aria-label="Participants">
      <span class="pill-row-empty">No participants</span>
    </div>
    <div id="headerSearch">
      <input id="searchInput" type="text" placeholder="Search across all transcripts..." autocomplete="off">
      <span id="searchCount" class="search-count"></span>
      <div id="searchResults" class="hidden"></div>
    </div>
  </header>

  <main id="trMain">
    <section id="videoSection">
      <video id="videoPlayer" controls preload="auto">
        <track id="subtitleTrack" kind="subtitles" label="Transcript" default>
      </video>
      <div id="videoEmpty" class="video-empty">
        <p>Select a participant to view their source video</p>
      </div>
    </section>

    <section id="summarySection" class="hidden">
      <div id="summaryHeader">
        <span class="summary-icon"></span>
        <span class="summary-title">Summary</span>
        <div id="summaryActions" class="summary-actions hidden">
          <button id="summaryRegenerate" type="button" class="summary-action-btn" title="Regenerate summary" aria-label="Regenerate summary">
            <span class="summary-action-icon summary-action-regenerate"></span>
          </button>
          <button id="citationsRegenerate" type="button" class="summary-action-btn" title="Regenerate citations" aria-label="Regenerate citations">
            <span class="summary-action-icon summary-action-citations"></span>
          </button>
          <button id="summaryCopy" type="button" class="summary-action-btn" title="Copy summary" aria-label="Copy summary">
            <span class="summary-action-icon summary-action-copy"></span>
          </button>
          <button id="summaryEdit" type="button" class="summary-action-btn" title="Edit summary" aria-label="Edit summary">
            <span class="summary-action-icon summary-action-edit"></span>
          </button>
        </div>
        <button id="summaryToggle" type="button" class="summary-toggle-btn" aria-label="Toggle summary" aria-expanded="true">
          <span class="summary-chevron"></span>
        </button>
      </div>
      <div id="summaryBody">
        <div id="summaryContent"></div>
      </div>
    </section>

    <section id="transcriptSection">
      <div id="segmentList"></div>
      <div id="transcriptEmpty" class="transcript-empty">
        <p>No transcript available</p>
        <p class="empty-hint">Use the Queue panel to transcribe this participant's video</p>
      </div>
    </section>
  </main>

  <!-- Corrections modal -->
  <div id="correctionsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Corrections Dictionary</h3>
        <button id="closeCorrectionsBtn" class="btn btn-small">Close</button>
      </div>
      <div id="addCorrectionForm" class="correction-form">
        <input id="correctionFrom" type="text" placeholder="Original text" autocomplete="off">
        <span class="correction-arrow">&rarr;</span>
        <input id="correctionTo" type="text" placeholder="Corrected text" autocomplete="off">
        <button id="addCorrectionBtn" class="btn btn-small">Add</button>
      </div>
      <div id="correctionsList"></div>
    </div>
  </div>

  <!-- Mark popover (shared, repositioned per use) -->
  <div id="markPopover" class="mark-popover hidden">
    <div class="mark-popover-categories"></div>
    <input class="mark-popover-label" type="text" placeholder="Label (optional)" autocomplete="off">
    <button class="mark-popover-remove btn btn-small">Remove</button>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="utils.js"></script>
  <script src="settings-modal.js"></script>
  <script src="grid-bg.js"></script>
  <script src="transcripts.js"></script>
</body>
</html>
