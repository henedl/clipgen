name: checks

on:
  push:
    branches:
      - master
    paths:
      - "**.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-only torch)
        run: |
          uv venv
          uv pip install . --torch-backend cpu

      - name: Run smoke tests
        run: uv run --no-sync pytest -c tests/pytest.ini

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Ruff check
        run: uvx ruff check

      - name: Ruff format check
        run: uvx ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-only torch)
        run: |
          uv venv
          uv pip install . --torch-backend cpu

      - name: Type check
        run: uvx ty check
