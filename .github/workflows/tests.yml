name: checks

on:
  push:
    branches:
      - master
    paths:
      - "**.py"
      - "assets/web/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "**.py"
      - "assets/web/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"

jobs:
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if commit is from a merged PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          MERGED=$(gh api "repos/${REPO}/pulls?state=closed&sort=updated&direction=desc&per_page=5" \
            --jq "[.[] | select(.merge_commit_sha == \"${SHA}\")] | length")
          if [[ "$MERGED" -gt 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit $SHA is from a merged PR — skipping redundant checks"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Commit $SHA is a direct push — running checks"
          fi

  smoke-tests:
    needs: [gate]
    if: always() && (needs.gate.outputs.skip != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (CPU-only torch)
        # pytest-cov and pytest-xdist are installed CI-only, the same pattern as
        # --torch-backend cpu (see AGENTS.md): kept out of pyproject.toml and
        # uv.lock so end-user installs and local `uv run` stay unaffected.
        # (pytest-randomly lives in the dev extra so local runs shuffle too.)
        run: |
          uv venv
          uv pip install ".[dev]" pytest-cov pytest-xdist --torch-backend cpu

      - name: Run tests with coverage gate
        # Always run the full suite. It finishes in well under a minute, and a
        # scoped subset risks false-green PRs when a change breaks an untested
        # sibling test file. The coverage floor lives in pyproject.toml
        # ([tool.coverage.report] fail_under) and fails the run if breached.
        # -n auto parallelizes across cores (each xdist worker is a separate
        # process, so module-level server globals stay isolated). The fixed
        # --randomly-seed keeps the shuffled order reproducible run-to-run.
        run: >-
          uv run --no-sync pytest -c tests/pytest.ini
          -n auto --randomly-seed=20240601 --cov=. --cov-report=term

  lint:
    needs: [gate]
    if: always() && (needs.gate.outputs.skip != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Ruff check
        run: uvx ruff check

      - name: Ruff format check
        run: uvx ruff format --check

  typecheck:
    needs: [gate]
    if: always() && (needs.gate.outputs.skip != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (CPU-only torch)
        run: |
          uv venv
          uv pip install ".[dev]" --torch-backend cpu

      - name: Type check
        run: uvx ty check
