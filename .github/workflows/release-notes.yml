# Creates a GitHub Release when a version tag v* is pushed, with notes generated
# from merged PRs and commits (same backend as the Releases UI).
#
# Does not update config.VERSIONNUM — keep the tag aligned with the version you ship.
# Runs in parallel with build-binaries.yml on the same tag; attach artifacts to this
# release in a follow-up change if needed.
name: release-notes

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping (idempotent rerun)."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
