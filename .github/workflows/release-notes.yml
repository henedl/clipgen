# Creates a GitHub Release for a version tag v*, with notes generated from merged
# PRs and commits (same backend as the Releases UI).
#
# Trigger: push of tag v*, or Actions → Run workflow (supply an existing remote tag).
#
# Does not update the build/VERSION file — keep the tag aligned with the version you ship.
# Runs in parallel with build-binaries.yml on the same tag; attach artifacts to this
# release in a follow-up change if needed.
name: release-notes

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v0.10.43). Must match v* and exist on the remote."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Verify build/VERSION matches tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          FILE_VERSION=$(cat build/VERSION)
          TAG_VERSION="${TAG#v}"
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::build/VERSION ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "build/VERSION and tag agree on $FILE_VERSION"

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — skipping (idempotent rerun)."
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
