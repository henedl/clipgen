# Auto-bumps the patch number in /build/VERSION when a feat: or fix: PR merges to master.
#
# Trigger: push to master.
# Detection: parses the merged PR title (or commit subject for direct pushes) for a
# conventional-commits prefix (feat: / fix:, with optional scope and breaking !).
# Anything else (docs:, chore:, refactor:, test:, build:, ci:, untyped) skips the bump.
#
# Auth: uses VERSION_BUMP_PAT — a fine-grained PAT with `Contents: write` on this
# repo. The default GITHUB_TOKEN cannot push past branch protection on master.
#
# Loop prevention: the bump commit message ends with [skip ci]; the workflow
# additionally skips when the head commit message contains [skip ci] or the actor
# is github-actions[bot].

name: version-bump

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout (with PAT so the push back is permitted)
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.VERSION_BUMP_PAT }}
          fetch-depth: 0

      - name: Determine bump
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"

          # Find the merged PR for this commit (if any).
          PR_NUMBER=$(gh pr list \
            --state merged \
            --search "$SHA" \
            --json number,mergeCommit \
            --jq "[.[] | select(.mergeCommit.oid == \"$SHA\")] | .[0].number // empty")

          if [[ -z "$PR_NUMBER" ]]; then
            # Direct push to master (rare). Use the commit subject.
            TITLE=$(git log -1 --format=%s "$SHA")
          else
            TITLE=$(gh pr view "$PR_NUMBER" --json title --jq .title)
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          if [[ "$TITLE" =~ ^(feat|fix)(\([^\)]+\))?!?: ]]; then
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
            echo "Will bump (title: $TITLE)"
          else
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            echo "No bump (title: $TITLE)"
          fi

      - name: Bump VERSION
        if: steps.decide.outputs.should_bump == 'true'
        run: |
          set -euo pipefail
          OLD=$(cat build/VERSION)
          IFS=. read -r MAJ MIN PATCH <<< "$OLD"
          NEW="${MAJ}.${MIN}.$((PATCH + 1))"
          echo "$NEW" > build/VERSION
          echo "Bumping ${OLD} -> ${NEW} (PR title: ${{ steps.decide.outputs.title }})"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/VERSION
          git commit -m "chore: bump version to ${NEW} [skip ci]"
          # Rebase in case another bump landed while this run was queued.
          git pull --rebase origin master
          git push origin master
