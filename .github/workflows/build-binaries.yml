name: build-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: clipgen-macos
            dist_path: dist/clipgen.app
          - os: windows-latest
            artifact_name: clipgen-windows
            dist_path: dist/clipgen.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify build/VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          FILE_VERSION=$(cat build/VERSION)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::build/VERSION ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "build/VERSION and tag agree on $FILE_VERSION"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install . --torch-backend cpu
          uv pip install pyinstaller==6.19.0

      - name: Build executable
        run: uv run pyinstaller --clean --noconfirm build/clipgen.spec

      - name: Compute artifact suffix
        id: suffix
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "suffix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-${{ steps.suffix.outputs.suffix }}
          path: ${{ matrix.dist_path }}
          if-no-files-found: error

      - name: Upload macOS raw binary
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v6
        with:
          name: clipgen-macos-bin-${{ steps.suffix.outputs.suffix }}
          path: dist/clipgen
          if-no-files-found: error
