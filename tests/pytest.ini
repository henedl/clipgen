[pytest]
testpaths = .
addopts = -q
# `norecursedirs` REPLACES pytest's default list rather than extending it, so the
# stock entries are repeated verbatim — dropping `.*` would make discovery
# descend into tests/.pytest_cache. The addition is `ui`: the opt-in
# headless-browser harness (agents/skills/ui-check/SKILL.md), which boots a real
# Flask server and drives Chromium. It must never run in /check or in CI.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} ui
markers =
    ui: opt-in headless-browser smoke; never collected by /check or CI
