[project]
name = "clipgen"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "gspread>=3.7.0",
    "openpyxl>=3.1.5",
    "icecream>=2.1.10",
    "rich>=13.0.0",
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "faster-whisper>=1.2.0",
    # 4.14.0.94 floor: the oldest 4.x that publishes an sdist, which the macOS
    # CI leg builds with -DWITH_FFMPEG=OFF to keep GPL FFmpeg out of the DMG
    # (plans/OPENCV-SELF-COMPILE-PLAN.md). <5 keeps CascadeClassifier and the
    # 4.x API this codebase is tested against.
    "opencv-python-headless>=4.14.0.94,<5",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "rapidocr>=3.9,<4",
    # Direct, not just transitive via faster-whisper: rapidocr runs its ONNX
    # models on whatever onnxruntime is installed (the engine is decoupled
    # from the package), so the Screenspace OCR tools depend on it directly.
    "onnxruntime>=1.24",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
# pytest-randomly shuffles test order every run so order-dependencies surface
# locally too (it prints `Using --randomly-seed=NNN` to reproduce). It's a tiny
# pure-Python plugin, so unlike pytest-cov / pytest-xdist (kept CI-only, see
# tests.yml) it lives in dev.
dev = ["pytest", "pytest-randomly"]
# Opt-in headless-browser harness (tests/ui/, agents/skills/ui-check/SKILL.md).
# Never installed by CI or by a plain `uv sync` — /ui-check prompts first, and
# `tests/pytest.ini` keeps tests/ui out of every default run. The version floor
# barely matters: the harness always passes `executable_path` explicitly rather
# than letting playwright resolve the browser build it expects.
ui = ["playwright>=1.55"]
# PyInstaller for the desktop bundle (agents/skills/build/SKILL.md). Pinned
# exactly, and only here: CI and the build docs install it with
# `uv sync --extra build`, so a bump is a one-line change plus `uv lock`.
build = ["pyinstaller==6.19.0"]

[tool.setuptools]
packages = []
# Every module lives in `source/`; the repo root holds only the `clipgen.py`
# launcher, which is deliberately not shipped (nothing imports it). Guarded by
# tests/test_packaging.py.
package-dir = {"" = "source"}
py-modules = [
    "app", "changelog", "cli", "cli_args", "composer_server", "config", "data_export",
    "desktop", "desktop_chrome", "desktop_menu", "excel_io",
    "files", "friction", "google_api", "interactive", "licenses", "mindnode",
    "llm_client",
    "overview", "pipeline", "profiling", "remux_server",
    "screenspace", "screenspace_frames", "screenspace_heatmap",
    "screenspace_manifest", "screenspace_multitool", "screenspace_ocr",
    "screenspace_preview", "screenspace_primitives", "screenspace_scans",
    "screenspace_server", "screenspace_tools", "screenspace_worker", "server",
    "server_utils", "spreadsheet", "start_settings", "thinking_agents",
    "titlecards", "updater",
    "transcripts", "transcripts_server", "utils", "video", "viewer",
    "workflows", "workflows_catalog", "workflows_runner", "workflows_server",
]

[tool.uv]
required-version = ">=0.11.0"
# rapidocr declares non-headless opencv-python; clipgen ships
# opencv-python-headless, which provides every cv2 API rapidocr uses.
# Without this override uv would install both wheels into the same cv2/
# tree, where they clobber each other file-by-file.
override-dependencies = [
    "opencv-python ; sys_platform == 'never'",
    # faster-whisper declares av (PyAV) but only calls it inside decode_audio(),
    # which clipgen never reaches: transcripts.py feeds transcribe() ndarrays
    # decoded by the ffmpeg CLI and stubs the module-scope `import av`
    # (transcripts._ensure_av_stub). Overriding it out drops PyAV's bundled
    # second FFmpeg (~45 MB of wheel dylibs on macOS, ~69 MB on Windows).
    "av ; sys_platform == 'never'",
]

[tool.ty.environment]
# ty auto-detects a module root only when it is literally named `src`
# ("Including `./src` in `environment.root` because a `./src` directory exists
# and is not a package"). Our directory is `source`, so say it explicitly or
# every first-party import comes back unresolved. `.` stays on the list so the
# root `clipgen.py` launcher is still checked.
root = [".", "./source"]

[tool.ruff]
# Ruff 0.16 enables ~413 rules by default (up from 59 in 0.15). We run those defaults
# as-is; the carve-outs below are the only deliberate exceptions. Pinned so a stale
# local ruff fails loudly instead of quietly disagreeing with CI (tests.yml lint job).
# `requires-python` above already gives ruff target-version = py312.
required-version = ">=0.16.0"

[tool.ruff.lint]
# T201: user-facing messages go through utils.error_print / warning_print /
# info_print / verbose_print (AGENTS.md), never bare print(). The per-file
# carve-outs below hold every sanctioned raw-print site.
extend-select = ["T201"]
ignore = [
    # ~50 `except Exception:` handlers at ffmpeg / OCR / worker-thread / HTTP
    # boundaries. Narrowing them is semantic work, tracked as "Narrow
    # `except Exception`" in agents/CODE-REVIEW.md. Drop this once that pass lands.
    "BLE001",
    # Import sorting. Module import order in the screenspace.py / workflows.py
    # re-export facades is a deliberate deepest-first DAG (agents/ARCHITECTURE.md;
    # the layer order itself is enforced by tests/test_import_layering.py).
    "I001",
    # Timestamps here are local wall-clock times for video/session metadata, never
    # cross-timezone instants. Naive datetimes are the correct representation.
    "DTZ005",
    "DTZ007",
    # PEP 695 generic syntax. Plain TypeVars read better in this codebase.
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# Both clusters are test-only, and both are correct test idioms:
# B018   — bare `resp.data` expressions that intentionally consume a streamed
#          response so the generator's finally-block runs.
# RUF012 — mutable class attributes on throwaway test doubles; ClassVar noise.
"tests/**" = ["B018", "RUF012", "T201"]
# Sanctioned bare-print sites (everything else routes through utils *_print):
# utils.py     — the *_print helpers' own plain-terminal fallbacks.
# profiling.py — profile report output, verbatim table rendering.
# interactive.py — raw-terminal browse UI (rich fallback branches, key echo).
# cli_args.py  — verbatim license text; see the comment at the call site.
# build/**     — standalone build scripts, no utils import.
"source/utils.py" = ["T201"]
"source/profiling.py" = ["T201"]
"source/interactive.py" = ["T201"]
"source/cli_args.py" = ["T201"]
"build/**" = ["T201"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
# CI coverage ratchet. Raise this as coverage improves; never lower it to make
# a PR pass. Measured on product modules only (tests/* omitted above).
fail_under = 60
